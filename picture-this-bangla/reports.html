<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picture This Bangla — problem reports</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=03b">
  <style>
    :root { --bg:#0b2414; --panel:#0f2f1b; --ink:#f2f5ee; --muted:#b9cbb3; --gold:#dbb96e; --line:rgba(219,185,110,.3); }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
    header h1 { margin:0; font-size:1.1rem; flex:1; min-width:220px; }
    .bn { font-family:"Kohinoor Bangla","Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif; }
    button, select, input, textarea { font:inherit; }
    .btn { border:1px solid var(--line); background:#205536; color:var(--ink); padding:7px 12px; border-radius:10px; cursor:pointer; font-weight:700; }
    .btn.primary { background:var(--gold); color:#14200f; border-color:transparent; }
    .tabs { display:flex; flex-wrap:wrap; gap:6px; }
    .tabs button[aria-pressed="true"] { background:var(--gold); color:#14200f; }
    main { max-width:1000px; margin:0 auto; padding:16px; }
    .signin { max-width:440px; margin:40px auto; padding:20px; background:var(--panel); border:1px solid var(--line); border-radius:16px; }
    .signin input { width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); margin:8px 0 12px; }
    .report { display:grid; grid-template-columns:110px 1fr; gap:14px; padding:14px; margin:0 0 12px; background:var(--panel); border:1px solid var(--line); border-radius:16px; }
    .thumb { width:110px; aspect-ratio:1; border-radius:12px; background:#fff no-repeat; background-size:208.334% 416.667%; border:1px solid var(--line); }
    .thumb.page { background-size:cover; background-position:top center; aspect-ratio:825/1275; }
    .meta { color:var(--muted); font-size:.8rem; }
    .title { margin:2px 0 6px; font-size:1.02rem; font-weight:800; }
    .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:.75rem; font-weight:800; background:#26663e; margin-right:4px; }
    .pill.open { background:#7a5b14; } .pill.resolved { background:#1f6b3a; } .pill.wont-fix { background:#555; } .pill.in-progress { background:#1e4f7a; }
    dl { display:grid; grid-template-columns:max-content 1fr; gap:4px 12px; margin:8px 0; }
    dt { color:var(--gold); font-weight:700; font-size:.85rem; } dd { margin:0; }
    .actions { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
    .actions input { flex:1; min-width:180px; padding:7px 10px; border-radius:10px; border:1px solid var(--line); }
    .resolution { margin-top:6px; padding:8px 10px; border-left:3px solid var(--gold); background:rgba(255,255,255,.04); border-radius:6px; font-size:.9rem; }
    .empty { text-align:center; color:var(--muted); padding:40px 0; }
    a { color:var(--gold); }
    @media (max-width:560px) { .report { grid-template-columns:1fr; } .thumb { width:96px; } }
  </style>
</head>
<body>
  <header>
    <h1>Picture This <span class="bn">বাংলা</span> — problem reports</h1>
    <div class="tabs" id="tabs"></div>
    <button class="btn" id="export" type="button" title="Download these reports as JSON (for Codex)">Export JSON</button>
    <button class="btn" id="refresh" type="button">Refresh</button>
    <button class="btn" id="signout" type="button">Sign out</button>
  </header>
  <main id="main"></main>
  <script>
    const ptbRevision = Date.now();
    document.write(`<script src="deck-data.js?v=${ptbRevision}"><\/script>`);
  </script>
  <script>
  (function () {
    const TOKEN_KEY = "ptb-reports-token";
    const STATUSES = [["open", "Open"], ["in-progress", "In progress"], ["resolved", "Resolved"], ["wont-fix", "Won't fix"], ["all", "All"]];
    const CATEGORY = {
      "pronunciation": "Pronunciation of the recording", "spelling": "Spelling", "uncommon-word": "Word is correct but uncommon",
      "wrong-word": "Word doesn't match the picture", "better-word": "Better / more common word suggested", "english-meaning": "English meaning wrong",
      "picture": "Picture wrong or strange", "question-unclear": "Question doesn't make sense", "question-grammar": "Question spelling/grammar",
      "question-unnatural": "Question wording unnatural", "question-too-hard": "Question too hard", "question-sensitive": "Question could upset/offend",
      "title": "Title wrong or unnatural", "other": "Other",
    };
    const DETAIL = {
      s_endVowel: "missing final sound (e.g. ও)", s_extraVowel: "extra sound in the middle", s_rr: "ড়/ঢ় said as ড/ঢ", s_vowel: "wrong vowel",
      s_consonant: "wrong consonant", s_stress: "rhythm/stress wrong", s_robotic: "robotic / cut off / noisy", s_differentWord: "says a different word",
      p_differentObject: "shows a different thing", p_strange: "strange details (hands, faces, parts, text)", p_notBd: "doesn't look like it does in Bangladesh",
      p_culture: "not culturally appropriate", p_hard: "hard to recognise", p_mismatch: "doesn't match the word",
      u_everyday: "everyday speech", u_formal: "formal/written", u_regional: "regional", u_family: "families/children",
    };
    const cards = (window.PTB_DECK && window.PTB_DECK.cards) || [];
    const bySlug = Object.fromEntries(cards.map(c => [c.id, c]));
    const byNumber = Object.fromEntries(cards.map(c => [c.number, c]));
    let status = "open", reports = [], counts = {};
    const main = document.querySelector("#main");
    const token = () => { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (_) { return ""; } };
    const el = (tag, attrs, ...kids) => {
      const n = document.createElement(tag);
      Object.entries(attrs || {}).forEach(([k, v]) => { if (v == null || v === false) return; if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v); });
      kids.flat().forEach(k => k != null && n.append(k.nodeType ? k : document.createTextNode(k)));
      return n;
    };
    async function api(path, opts = {}) {
      const res = await fetch("../api/ptb/" + path, { ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + token(), ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
      if (res.status === 403) { signIn("That token was not accepted."); throw new Error("forbidden"); }
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
      return res;
    }
    function signIn(message) {
      main.replaceChildren(el("form", { class: "signin", onsubmit: e => { e.preventDefault(); try { localStorage.setItem(TOKEN_KEY, e.target.tok.value.trim()); } catch (_) {} load(); } },
        el("h2", {}, "Sign in"), el("p", {}, "Enter the reports token (the PTB_REPORTS_TOKEN secret in Replit, or the TTS upload token if that isn't set). It is kept in this browser only."),
        el("input", { name: "tok", type: "password", autocomplete: "off", required: "" }), message ? el("p", { style: "color:#ffb4ab" }, message) : null,
        el("button", { class: "btn primary", type: "submit" }, "Show reports")));
    }
    function renderTabs() {
      const tabs = document.querySelector("#tabs");
      tabs.replaceChildren(...STATUSES.map(([code, label]) => {
        const n = code === "all" ? Object.values(counts).reduce((a, b) => a + b, 0) : (counts[code] || 0);
        return el("button", { class: "btn", type: "button", "aria-pressed": String(status === code), onclick: () => { status = code; load(); } }, `${label} (${n})`);
      }));
    }
    function thumbFor(r) {
      const card = bySlug[r.card && r.card.slug] || byNumber[r.card && r.card.number];
      const t = r.target || {};
      if (!card) return el("div", { class: "thumb" });
      if (t.kind === "item" && t.index) {
        const i = t.index - 1, x = i % 2 === 0 ? "1.923%" : "98.077%", y = ["10.526%", "42.105%", "73.684%"][Math.floor(i / 2)];
        const d = el("div", { class: "thumb" }); d.style.backgroundImage = `url("${card.front}")`; d.style.backgroundPosition = `${x} ${y}`; return d;
      }
      const d = el("div", { class: "thumb page" }); d.style.backgroundImage = `url("${t.kind === "question" ? card.back : card.front}")`; return d;
    }
    function changedNote(r) {
      // Has the card changed since the report? (snapshot vs current deck)
      const card = bySlug[r.card && r.card.slug]; const t = r.target || {};
      if (!card) return "This card is no longer in the deck (renamed or removed).";
      if (t.kind === "item") { const it = card.items.find(x => x.id === t.id); if (!it) return "This picture is no longer on the card."; if (it.label !== t.label) return `Word has changed since the report: now ${it.label}.`; }
      if (t.kind === "question" && t.index && card.questions && card.questions[t.index - 1] !== t.question) return `Question has changed since the report: now “${card.questions[t.index - 1]}”.`;
      return "";
    }
    function reportView(r) {
      const t = r.target || {}, d = r.details || {};
      const details = [...(d.faults || []), ...(d.usage || [])].map(k => DETAIL[k] || k);
      if (d.region) details.push("region: " + d.region);
      const what = t.kind === "item" ? `Picture ${t.index}: ` : t.kind === "question" ? `Question ${t.index}: ` : t.kind === "title" ? "Title: " : "Whole card";
      const shown = t.kind === "item" ? `${t.label} — ${t.gloss}` : t.kind === "question" ? t.question : t.kind === "title" ? t.label : "";
      const note = el("input", { type: "text", placeholder: "What was done (optional)", value: r.resolution || "" });
      const audioSlot = el("span", {});
      if (r.has_audio) audioSlot.append(el("button", { class: "btn", type: "button", onclick: async () => {
        const blob = await (await api(`reports/${r.id}/audio`)).blob(); const a = el("audio", { controls: "" }); a.src = URL.createObjectURL(blob); audioSlot.replaceChildren(a); a.play(); } }, "▶ Reporter's recording"));
      const setStatus = s => async () => { await api("reports/status", { method: "POST", body: JSON.stringify({ ids: [r.id], status: s, resolution: note.value, by: "tim" }) }); load(); };
      const changed = changedNote(r);
      return el("article", { class: "report" }, thumbFor(r), el("div", {},
        el("div", { class: "meta" }, el("span", { class: "pill " + r.status }, r.status), `#${r.id} · ${new Date(r.created_at * 1000).toLocaleString()} · `,
          (r.reporter && r.reporter.role === "bangla-speaker") ? "Bangla speaker" : "Learner", r.reporter && r.reporter.name ? ` (${r.reporter.name})` : ""),
        el("div", { class: "title" }, el("a", { href: `index.html?card=${r.card.number}`, target: "_blank" }, `Card ${r.card.number}`), " · ", el("span", { class: "bn" }, r.card.title)),
        el("dl", {},
          el("dt", {}, "Part"), el("dd", { class: "bn" }, what + shown),
          el("dt", {}, "Problem"), el("dd", {}, CATEGORY[r.category] || r.category),
          details.length ? [el("dt", {}, "Details"), el("dd", {}, details.join(" · "))] : null,
          r.suggestion ? [el("dt", {}, "Suggestion"), el("dd", { class: "bn" }, r.suggestion)] : null,
          r.description ? [el("dt", {}, "Notes"), el("dd", { class: "bn" }, r.description)] : null,
          t.audio_source ? [el("dt", {}, "Recording"), el("dd", {}, t.audio_source)] : null,
          changed ? [el("dt", {}, "Now"), el("dd", { class: "bn" }, changed)] : null),
        r.resolution && r.status !== "open" ? el("div", { class: "resolution" }, `${r.resolved_by || ""}: ${r.resolution}`) : null,
        el("div", { class: "actions" }, audioSlot, note,
          r.status !== "resolved" ? el("button", { class: "btn primary", type: "button", onclick: setStatus("resolved") }, "Resolved") : null,
          r.status !== "wont-fix" ? el("button", { class: "btn", type: "button", onclick: setStatus("wont-fix") }, "Won't fix") : null,
          r.status !== "open" ? el("button", { class: "btn", type: "button", onclick: setStatus("open") }, "Reopen") : null)));
    }
    async function load() {
      if (!token() && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") { signIn(); return; }
      main.replaceChildren(el("p", { class: "empty" }, "Loading…"));
      try {
        const data = await (await api(`reports?status=${status}`)).json();
        reports = data.reports || []; counts = data.counts || {};
      } catch (err) { if (err.message !== "forbidden") main.replaceChildren(el("p", { class: "empty" }, "Could not load reports: " + err.message)); return; }
      renderTabs();
      main.replaceChildren(...(reports.length ? reports.slice().reverse().map(reportView) : [el("p", { class: "empty" }, "No reports here.")]));
    }
    document.querySelector("#refresh").onclick = load;
    document.querySelector("#signout").onclick = () => { try { localStorage.removeItem(TOKEN_KEY); } catch (_) {} signIn(); };
    document.querySelector("#export").onclick = () => {
      const blob = new Blob([JSON.stringify({ exported_at: new Date().toISOString(), status, reports }, null, 2)], { type: "application/json" });
      const a = el("a", { href: URL.createObjectURL(blob), download: `ptb-reports-${status}-${new Date().toISOString().slice(0, 10)}.json` }); document.body.append(a); a.click(); a.remove();
    };
    load();
  })();
  </script>
</body>
</html>
