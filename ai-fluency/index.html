<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#103D21">
<meta name="description" content="Learn AI fluency by doing it on a phone. Help Ayesha write an honest CV with AI, set up an AI agent safely, and vibe-code a small app — with a coach beside you at every step.">
<title>AI Fluency Lab · Dialogue</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="intro.css?v=17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&family=Roboto+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,600;1,400&family=Public+Sans:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TWO WORLDS ON ONE SCREEN
   1. The coach  — Dialogue Brand Book (paper, forest, gold, Spectral).
   2. The phone  — Android, Material 3 (Roboto Flex, tonal purple).
   They never borrow each other's colours, so a student can always
   tell "the teacher" from "the phone".
   ============================================================ */
:root{
  /* Dialogue brand */
  --forest:#103D21; --forest-deep:#0C3319; --gold:#B9924F; --gold-light:#D2B978; --gold-soft:#F0E6CD;
  --paper:#F4F1E6; --card:#FFFDF7; --mist:#F4F6F0; --ink:#1D211C; --ink-muted:#5F6A5C;
  --moss:#6F8F62; --moss-soft:#E3EAD9; --clay:#B0563A; --clay-ink:#8E402B; --clay-soft:#F6E3DC;
  --kicker:#795E20; --rule:rgba(16,61,33,.16); --rule-strong:rgba(16,61,33,.34);
  --ok:#1F7A47; --ok-soft:#DCEFE2;
  /* the four Ds — the same four hues as the Culture Circles rings */
  --d-del:#8A5610; --d-del-t:#F6EBD7;
  --d-des:#0A6A62; --d-des-t:#DDEFEC;
  --d-dis:#3F4FA8; --d-dis-t:#E4E7F7;
  --d-dil:#A8322A; --d-dil-t:#F7E3E1;
  --font-display:'Spectral',Georgia,serif;
  --font-ui:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-bn:'Noto Sans Bengali','Public Sans',sans-serif;
  --ui:1;

  /* Android — Material 3 baseline tonal palette */
  --md-primary:#65558F; --md-on-primary:#fff; --md-primary-container:#E9DDFF; --md-on-primary-container:#22005D;
  --md-secondary-container:#E8DEF8; --md-on-secondary-container:#1D192B;
  --md-tertiary:#7D5260; --md-tertiary-container:#FFD8E4;
  --md-surface:#FEF7FF; --md-surface-low:#F7F2FA; --md-surface-c:#F3EDF7; --md-surface-high:#ECE6F0; --md-surface-highest:#E6E0E9;
  --md-on-surface:#1D1B20; --md-on-surface-var:#49454F; --md-outline:#79747E; --md-outline-var:#CAC4D0;
  --md-error:#B3261E; --md-error-container:#F9DEDC;
  --md-font:'Roboto Flex','Roboto',system-ui,sans-serif;
  --md-mono:'Roboto Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,0,0,1);
  --ease-emph:cubic-bezier(.05,.7,.1,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);-webkit-tap-highlight-color:transparent;overflow:hidden;
  height:100dvh;}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}

/* ---------- page layout ---------- */
#app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;}
#coach{grid-row:1;position:relative;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
#stagewrap{grid-row:2;position:relative;z-index:1;min-height:0;overflow:hidden;background:#1b1b1f;display:flex;align-items:center;justify-content:center}
@media (min-width:900px){
  #app{grid-template-columns:minmax(0,1fr) minmax(400px,calc(470px*var(--ui)));grid-template-rows:1fr}
  #stagewrap{grid-column:1;grid-row:1;background:radial-gradient(120% 90% at 30% 20%,#E9E4D3 0,#DCD5BF 60%,#CFC7AE 100%)}
  #coach{grid-column:2;grid-row:1;border-bottom:0;border-left:1px solid var(--rule)}
}

/* ---------- COACH (Dialogue brand) ---------- */
.c-top{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--paper)}
.c-logo{display:flex;align-items:center;background:#fff;border-radius:7px;padding:3px 6px;border:1px solid var(--rule);text-decoration:none}
.c-logo img{height:26px;width:auto;display:block}
.c-title{font-family:var(--font-display);font-weight:600;color:var(--forest);font-size:calc(17px*var(--ui));line-height:1.1;flex:1;min-width:0}
.c-title small{display:block;font-family:var(--font-ui);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--kicker)}
.lang{display:flex;border:1px solid var(--rule-strong);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:5px 10px;font-weight:700;font-size:13px;color:var(--forest)}
.lang button[aria-pressed="true"]{background:var(--forest);color:var(--paper)}
.lang button:last-child{font-family:var(--font-bn);font-weight:600}
.iconbtn{border:0;background:transparent;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--forest);flex:none}
.iconbtn:hover{background:var(--moss-soft)}
.iconbtn svg{width:20px;height:20px}

.c-rail{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.c-rail::-webkit-scrollbar{display:none}
.c-rail button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;border-radius:999px;padding:4px 10px 4px 4px;font-size:calc(13px*var(--ui));font-weight:600;color:var(--ink-muted)}
.c-rail button i{font-style:normal;width:22px;height:22px;border-radius:999px;display:grid;place-items:center;font-size:12px;background:var(--rule);color:var(--ink)}
.c-rail button.on{background:var(--card);border-color:var(--rule-strong);color:var(--forest)}
.c-rail button.on i{background:var(--dc,var(--forest));color:#fff}
.c-rail button.done i{background:var(--dc,var(--moss));color:#fff;opacity:.55}

.c-body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 6px;overscroll-behavior:contain}
.kick{display:flex;align-items:center;gap:8px;font-size:calc(11.5px*var(--ui));font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--kicker);margin-bottom:4px}
.dtag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 6px;border-radius:999px;background:var(--dt);color:var(--dc);letter-spacing:.04em}
.dtag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--dc)}
.d-del{--dc:var(--d-del);--dt:var(--d-del-t)} .d-des{--dc:var(--d-des);--dt:var(--d-des-t)}
.d-dis{--dc:var(--d-dis);--dt:var(--d-dis-t)} .d-dil{--dc:var(--d-dil);--dt:var(--d-dil-t)}
.say{font-family:var(--font-display);font-weight:600;color:var(--forest);font-size:calc(19px*var(--ui));line-height:1.25;margin:2px 0 0}
.bn{display:none;font-family:var(--font-bn);color:var(--ink-muted);font-size:calc(14px*var(--ui));line-height:1.5;margin-top:3px;font-weight:400}
body.bangla .bn{display:block}
.say + .bn{font-size:calc(15px*var(--ui))}
.sub{color:var(--ink-muted);font-size:calc(14.5px*var(--ui));line-height:1.45;margin:6px 0 0}


/* ---------- the 4D gears ---------- */
@property --ga{syntax:'<angle>';inherits:true;initial-value:0deg}
.compass{display:block;width:100%;height:auto;overflow:visible;transition:--ga 1.1s cubic-bezier(.3,.05,.2,1)}
.compass .rot{transform:rotate(calc(var(--o) + var(--ga) * var(--s)))}
.compass .gear .teeth{fill:var(--gt);stroke:var(--gc);stroke-width:2;stroke-opacity:.45;transition:fill .5s}
.compass .gear .axle{fill:var(--card);stroke:var(--gc);stroke-width:1.2;stroke-opacity:.35}
.compass .gear .sym{fill:var(--gc);opacity:.72;transition:fill .5s,opacity .5s}
.compass .gear.on .teeth{fill:var(--gc);stroke-opacity:1}
.compass .gear.on .axle{fill:color-mix(in srgb,var(--gc) 82%,#000);stroke:none}
.compass .gear.on .sym{fill:#fff;opacity:1}
.compass .gear .halo{fill:var(--gold-light);opacity:.55;animation:halo 2.4s ease-in-out infinite}
@keyframes halo{50%{opacity:.25}}
.compass .g-del{--gc:var(--d-del);--gt:var(--d-del-t)} .compass .g-des{--gc:var(--d-des);--gt:var(--d-des-t)}
.compass .g-dis{--gc:var(--d-dis);--gt:var(--d-dis-t)} .compass .g-dil{--gc:var(--d-dil);--gt:var(--d-dil-t)}
.compass .sweet{fill:var(--gold);stroke:var(--card);stroke-width:2.5}
.compass .sweet.lit{filter:drop-shadow(0 0 5px var(--gold-light))}
.compass .loop{fill:none;stroke-width:2;opacity:.28}
.compass .loop.lv{stroke:var(--d-del)} .compass .loop.lh{stroke:var(--d-des)}

.dband{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:linear-gradient(90deg,var(--dt,var(--mist)) 0,var(--paper) 75%);padding:6px 12px;font:inherit;color:var(--ink);cursor:pointer}
.dband[hidden]{display:none}
.dband .dcomp{flex:none;width:calc(58px*var(--ui));height:calc(58px*var(--ui))}
.dband .dtx{flex:1;min-width:0;display:flex;flex-direction:column}
.dband .dtx b{font-family:var(--font-display);font-size:calc(17px*var(--ui));color:var(--dc,var(--forest));line-height:1.15}
.dband .dtx b i{font-style:normal;font-family:var(--font-ui);font-size:.68em;font-weight:800;display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:99px;background:var(--dc);color:#fff;margin-right:6px;vertical-align:.12em}
.dband .dtx b em{font-style:normal;font-family:var(--font-ui);font-weight:600;font-size:.72em;color:var(--ink-muted)}
.dband .dtx b.story{color:var(--forest)}
.dband .dph{display:none}
.dband .dstage{display:none;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted)}
.compass.all .gear .halo{animation-delay:calc(var(--s) * .6s)}
.dband .dq{font-size:calc(13.5px*var(--ui));color:var(--ink-muted);line-height:1.3}
.dband .bn{font-size:calc(12.5px*var(--ui));margin-top:1px}
.dband .dmore{flex:none;width:24px;height:24px;border-radius:99px;border:1px solid var(--rule-strong);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-muted)}
.dband.pulse .dcomp{animation:bandpop .7s ease-out}
@keyframes bandpop{40%{transform:scale(1.12)}}

.d4b{display:inline-block;width:var(--sz);height:var(--sz);flex:none;vertical-align:middle}
.d4b svg{width:100%;height:100%;display:block}
.d4b .teeth{fill:var(--dt);stroke:var(--dc);stroke-width:3;stroke-opacity:.5}
.d4b .sym{fill:var(--dc)}
.d4b.lit .teeth{fill:var(--dc);stroke:none} .d4b.lit .sym{fill:#fff}
.d4i{display:inline-block;vertical-align:-.15em}
.c-rail button .d4b{margin:-1px 0}
.c-rail button:not(.on):not(.done) .d4b{filter:grayscale(1);opacity:.5}
.c-rail button.done .d4b{opacity:.6}

.dshift{border-radius:12px;background:var(--dt);border:1px solid color-mix(in srgb,var(--dc) 35%,transparent);padding:9px 11px;margin:0 0 10px}
.ds-row{display:flex;align-items:center;gap:7px}
.ds-arr{color:var(--ink-muted);font-weight:700}
.ds-tag{display:flex;flex-direction:column;line-height:1.2;margin-left:2px}
.ds-tag b{color:var(--dc);font-size:calc(14px*var(--ui))}
.ds-tag small{font-size:calc(11.5px*var(--ui));letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);font-weight:700}
.ds-tag .bn{font-size:12px;margin-top:0}
.ds-why{margin:7px 0 0;font-size:calc(14.5px*var(--ui));line-height:1.42}
.ds-why b{color:var(--dc)}
.ds-link{margin:5px 0 0;font-size:calc(12.5px*var(--ui));color:var(--ink-muted);line-height:1.35}
.ds-link .d4i{fill:var(--ink-muted)}

.d4legend{display:grid;grid-template-columns:1fr minmax(0,1.05fr) 1fr;grid-template-areas:". n ." "w c e" ". s .";gap:6px 8px;align-items:center;margin:8px 0}
.lg-c{grid-area:c;max-width:170px;justify-self:center;width:100%}
.lg-pt{border-radius:10px;background:var(--dt);border:1px solid color-mix(in srgb,var(--dc) 30%,transparent);padding:6px 8px;font-size:calc(12.5px*var(--ui));line-height:1.3}
.lg-del{grid-area:n} .lg-des{grid-area:w} .lg-dis{grid-area:e} .lg-dil{grid-area:s}
.lg-pt b{display:block;color:var(--dc);font-size:calc(14px*var(--ui))}
.lg-pt b .d4i{fill:var(--dc);margin-right:5px;vertical-align:-.12em}
.lg-v{display:block;font-weight:700;font-size:.92em;color:var(--ink)}
.lg-q{display:block;color:var(--ink-muted)}
.lg-x{display:block;margin-top:4px;padding-top:4px;border-top:1px dashed color-mix(in srgb,var(--dc) 40%,transparent);color:var(--ink);font-size:1.02em}
.d4legend.compact .lg-q{display:none}
.d4legend.compact .lg-x ~ .bn,.d4legend.compact .lg-pt > .bn{display:none}
body.bangla .d4legend.compact .lg-x .bn{display:block}
.d4loops{display:grid;gap:6px;font-size:calc(13px*var(--ui));line-height:1.4}
.d4loops > div{display:grid;grid-template-columns:24px 1fr;gap:6px;align-items:start}
.d4loops p{margin:0}
.d4loops span.lv,.d4loops span.lh,.d4loops span.lc{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:800;color:#fff}
.d4loops .lv{background:linear-gradient(var(--d-del),var(--d-dil))} .d4loops .lh{background:linear-gradient(90deg,var(--d-des),var(--d-dis))} .d4loops .lc{background:var(--gold)}
.d4path .pathrow{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin:6px 0}
.d4path .pa{color:var(--ink-muted);font-weight:700;font-size:13px}
.d4path .pa.x{color:var(--gold);font-size:15px}
@media (max-width:899px){
  .dband{padding:5px 10px;gap:8px}
  .dband .dcomp{width:44px;height:44px}
  .dband .dq{display:none}
  .dband .dtx b{font-size:15.5px}
  .dband .bn{display:none}
  .dshift{padding:7px 9px;margin-bottom:8px}
  .dshift .ds-tag small,.dshift .ds-link{display:none}
  .dshift .ds-why{margin-top:5px;font-size:14px}
  body.inlesson .c-rail{display:none}
  .dband .dstage{display:block}
}
@media (max-width:420px){ .d4legend{grid-template-columns:1fr 1fr;grid-template-areas:"n n" "c c" "w e" "s s"} .lg-c{max-width:120px} }

/* ON A PHONE: the instruction stays pinned at the top, the phone fills the middle,
   the coach's cards live in a pull-up sheet over the phone, and Back / Show me /
   Next sit in a fixed bar at the bottom. Nothing is ever pushed off screen. */
.c-say{padding:10px 14px 0}
.c-say:empty{display:none}
.c-say .sub{margin-top:4px}
.peek{display:none}
@media (min-width:900px){ .c-say + .c-body{padding-top:6px} }
@media (max-width:899px){
  #coach{max-height:none;z-index:30}
  .c-say{padding:8px 12px 8px;border-bottom:1px solid var(--rule);background:var(--paper)}
  .c-say .sub{font-size:13.5px;margin-top:3px}
  .c-say .bn{font-size:13.5px}
  .c-body{position:fixed;left:0;right:0;bottom:var(--acth,58px);z-index:35;background:var(--paper);
    max-height:calc(100dvh - var(--toph,150px) - var(--acth,58px));padding:0 12px 14px;
    border-radius:18px 18px 0 0;box-shadow:0 -8px 28px rgba(12,51,25,.22);
    transform:translateY(calc(100% - 48px));transition:transform .28s var(--ease)}
  #coach.sheet-up .c-body{transform:none}
  #coach.no-sheet .c-body{display:none}
  #coach.full .c-body{max-height:calc(100dvh - var(--toph,150px) - var(--acth,58px));min-height:calc(100dvh - var(--toph,150px) - var(--acth,58px));border-radius:0;box-shadow:none}
  .peek{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:2;width:calc(100% + 24px);margin:0 -12px 6px;padding:6px 14px 8px;border:0;background:var(--paper);border-radius:18px 18px 0 0;font-weight:800;font-size:14.5px;color:var(--forest);min-height:48px}
  .peek::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:9px;background:var(--rule-strong)}
  .peek .pl{flex:1;text-align:left;padding-top:6px}
  .peek .pc{padding-top:6px;font-size:13px;transition:transform .25s}
  #coach.sheet-up .peek .pc{transform:rotate(180deg)}
  #coach.full .peek{display:none}
  .c-actions{position:fixed;left:0;right:0;bottom:0;z-index:40}
  #stagewrap{padding-bottom:calc(var(--acth,58px) + 48px)}
  body.no-sheet #stagewrap,body:not(.inlesson) #stagewrap{padding-bottom:var(--acth,58px)}
  .dshift .ds-row,.dshift .ds-say{display:none}
  .dshift{background:transparent;border:0;padding:0;margin:0 0 6px}
  .dshift .ds-more{margin-top:0}
  .dband .dph{display:block;font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--dc,var(--forest));line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-title small{display:none}
  .c-rail{padding:6px 10px}
  .c-rail button span{display:none}
  .c-rail button.on span{display:inline}
  .say{font-size:calc(17px*var(--ui))}
  .recipe{grid-template-columns:1fr 1fr}
  .slot{grid-template-columns:20px 1fr;gap:6px;padding:6px 7px}
  .slot .tick{width:20px;height:20px;font-size:11px}
  .slot span{font-size:12.5px}
}
.c-actions{display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);background:var(--paper)}
.btn{border:1px solid var(--forest);background:var(--forest);color:var(--paper);border-radius:7px;padding:9px 16px;font-weight:700;font-size:calc(14.5px*var(--ui));display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:42px}
.btn.quiet{background:transparent;color:var(--forest);border-color:var(--rule-strong)}
.btn.gold{background:var(--gold-soft);border-color:var(--gold);color:#4A3A12}
.btn:disabled{opacity:1;background:var(--mist);border-color:var(--rule);color:var(--ink-muted);cursor:default}
.c-actions .grow{flex:1}
.c-actions .btn.next{flex:1;max-width:260px;margin-left:auto}
.c-actions .btn{white-space:nowrap}
.c-actions .count{font-size:12.5px;font-weight:700;color:var(--ink-muted);min-width:34px;text-align:center}
.dots{display:flex;gap:4px;align-items:center}
.dots b{width:16px;height:4px;border-radius:2px;background:var(--rule)}
.dots b.on{background:var(--forest);width:26px}
.dots b.done{background:var(--moss)}
.btn svg,.chip svg{width:16px;height:16px;flex:none}

/* coach cards */
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;box-shadow:0 1px 2px rgba(16,61,33,.06),0 6px 16px rgba(16,61,33,.07);padding:12px;margin:10px 0}
.card h3{font-family:var(--font-display);font-weight:600;color:var(--forest);margin:0 0 6px;font-size:calc(17px*var(--ui))}
.card p{margin:4px 0;font-size:calc(14.5px*var(--ui));line-height:1.45}
.plist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.plist li{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;font-size:calc(14.5px*var(--ui));line-height:1.4}
.plist li .ic{width:30px;height:30px;border-radius:8px;background:var(--gold-soft);display:grid;place-items:center;font-size:16px}
.who{display:flex;gap:12px;align-items:center}
.who .av{width:54px;height:54px;border-radius:999px;background:linear-gradient(135deg,#E8C9A8,#C98E62);display:grid;place-items:center;font-family:var(--font-display);font-size:24px;color:#fff;font-weight:600;flex:none;border:3px solid #fff;box-shadow:0 0 0 1px var(--rule)}
.who b{font-family:var(--font-display);font-size:calc(18px*var(--ui));color:var(--forest)}
.who span{display:block;color:var(--ink-muted);font-size:13px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.facts span{background:var(--mist);border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;color:var(--forest)}

/* sort rows: one item, three buttons — tap, never drag */
.sort{display:grid;gap:8px;margin-top:8px}
.srow{border:1px solid var(--rule);border-radius:10px;padding:9px;background:#fff}
.srow .it{font-weight:600;font-size:calc(14.5px*var(--ui));line-height:1.35}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:80px;border:1px solid var(--rule-strong);background:var(--paper);border-radius:999px;padding:6px 8px;font-size:calc(13px*var(--ui));font-weight:700;color:var(--forest)}
.seg button.pick{background:var(--forest);color:#fff;border-color:var(--forest)}
.seg button.pick.wrong{background:var(--clay);border-color:var(--clay)}
.why{margin-top:7px;font-size:calc(13.5px*var(--ui));line-height:1.4;padding:7px 9px;border-radius:8px;background:var(--ok-soft);color:#14482B}
.why.no{background:var(--clay-soft);color:var(--clay-ink)}
.why b{font-weight:700}

.opts{display:grid;gap:8px;margin-top:8px}
.opt{text-align:left;border:1px solid var(--rule-strong);background:#fff;border-radius:10px;padding:10px 12px;font-size:calc(14.5px*var(--ui));line-height:1.35;font-weight:600;color:var(--ink)}
.opt.pick{border-color:var(--forest);box-shadow:inset 0 0 0 1px var(--forest)}
.opt.pick.wrong{border-color:var(--clay);box-shadow:inset 0 0 0 1px var(--clay)}

/* prompt recipe meter */
.recipe{display:grid;gap:6px;margin-top:8px}
.slot{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;padding:7px 9px;border-radius:9px;border:1px dashed var(--rule-strong);background:#fff}
.slot .tick{width:24px;height:24px;border-radius:999px;border:2px solid var(--rule-strong);display:grid;place-items:center;font-size:13px;color:#fff}
.slot.on{border-style:solid;border-color:var(--d-des);background:var(--d-des-t)}
.slot.on .tick{background:var(--d-des);border-color:var(--d-des)}
.slot b{display:block;font-size:calc(12px*var(--ui));letter-spacing:.07em;text-transform:uppercase;color:var(--d-des)}
.slot span{font-size:calc(13.5px*var(--ui));color:var(--ink-muted);line-height:1.35}
.slot span em{font-style:normal;font-weight:700;color:var(--ink)}
.warn{margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--clay-soft);color:var(--clay-ink);font-size:calc(13.5px*var(--ui));line-height:1.4;border-left:4px solid var(--clay)}
.good{margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--ok-soft);color:#14482B;font-size:calc(13.5px*var(--ui));line-height:1.4;border-left:4px solid var(--ok)}
.note{margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--gold-soft);color:#4A3A12;font-size:calc(13.5px*var(--ui));line-height:1.4;border-left:4px solid var(--gold)}

/* verdict buttons */
.verd{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.verd button{border:1px solid var(--rule-strong);background:#fff;border-radius:10px;padding:8px 4px;font-size:calc(12.5px*var(--ui));font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.15}
.verd button i{font-style:normal;font-size:18px}
.verd button.pick{background:var(--forest);color:#fff;border-color:var(--forest)}
.verd button.pick.wrong{background:var(--clay);border-color:var(--clay)}
.quote{margin-top:6px;padding:8px 10px;background:var(--mist);border-left:4px solid var(--d-dis);border-radius:6px;font-size:calc(13.5px*var(--ui));line-height:1.4}
.quote small{display:block;font-weight:700;color:var(--d-dis);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.tally{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tally span{width:26px;height:26px;border-radius:999px;border:2px solid var(--rule-strong);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-muted)}
.tally span.done{background:var(--d-dis);border-color:var(--d-dis);color:#fff}

/* checklist */
.chk{display:grid;gap:8px;margin-top:8px}
.chk button{display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;border:1px solid var(--rule);background:#fff;border-radius:10px;padding:9px 10px;font-size:calc(14px*var(--ui));line-height:1.35}
.chk button i{width:24px;height:24px;border-radius:6px;border:2px solid var(--rule-strong);display:grid;place-items:center;font-style:normal;color:#fff;font-size:14px}
.chk button.on{border-color:var(--d-dil)}
.chk button.on i{background:var(--d-dil);border-color:var(--d-dil)}
.chk button b{display:block}

/* story panels (wordless where possible) */
.story{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.story div{background:var(--mist);border:1px solid var(--rule);border-radius:10px;padding:8px 6px;text-align:center;font-size:calc(12.5px*var(--ui));line-height:1.3;color:var(--ink)}
.story div .em{font-size:30px;line-height:1.2;display:block;margin-bottom:4px}
.story div.bad{background:var(--clay-soft);border-color:#E3B9AA}

/* access map / end summary */
.lanes{display:grid;gap:8px;margin-top:8px}
.lane{border-radius:10px;padding:8px 10px;border:1px solid var(--rule)}
.lane h4{margin:0 0 6px;font-size:calc(12.5px*var(--ui));letter-spacing:.07em;text-transform:uppercase}
.lane div{display:flex;flex-wrap:wrap;gap:6px}
.lane span{background:#fff;border:1px solid var(--rule);border-radius:999px;padding:3px 9px;font-size:13px;font-weight:600}
.lane.g{background:var(--ok-soft)} .lane.g h4{color:var(--ok)}
.lane.a{background:var(--gold-soft)} .lane.a h4{color:#7A5A12}
.lane.r{background:var(--clay-soft)} .lane.r h4{color:var(--clay-ink)}
.fourq{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.fourq div{background:var(--d-dil-t);border-radius:10px;padding:8px;font-weight:700;color:var(--d-dil);font-size:calc(14px*var(--ui));line-height:1.3}
.fourq div small{display:block;font-weight:400;color:var(--ink-muted);font-family:var(--font-bn);font-size:12.5px}
.ptab{width:100%;border-collapse:collapse;font-size:13.5px}
.ptab th,.ptab td{padding:6px 5px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.ptab th{font-size:12px;color:var(--ink-muted);font-weight:700}
.ptab td:first-child{color:var(--ink-muted);font-size:12.5px}
.ptab .on{background:var(--d-dil-t);color:var(--d-dil);font-weight:700}
.big4{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.big4 div{border-radius:10px;padding:8px 9px;background:var(--dt);border:1px solid color-mix(in srgb,var(--dc) 30%,transparent)}
.big4 b{color:var(--dc);display:block;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.big4 span{font-size:13.5px;line-height:1.35}
.listen{border:1px solid var(--rule-strong);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--forest);display:inline-flex;gap:6px;align-items:center;margin-top:6px}
.saylines{display:grid;gap:6px;margin-top:8px}
.saylines div{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--gold);border-radius:8px;padding:8px 10px;font-size:calc(15px*var(--ui));line-height:1.4}
.saylines u{text-decoration:none;background:var(--gold-soft);padding:0 3px;border-radius:3px;font-weight:600}
.pick-cards{display:grid;gap:10px;margin-top:10px}
.pcard{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:10px;box-shadow:0 1px 2px rgba(16,61,33,.06)}
.pcard .pi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.pcard b{font-family:var(--font-display);color:var(--forest);font-size:calc(16.5px*var(--ui));display:block}
.pcard span{font-size:13px;color:var(--ink-muted)}
.pcard em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--kicker)}
.pcard .done{font-size:12px;font-weight:700;color:var(--ok)}

/* menu sheet */
#menu{position:fixed;inset:0;z-index:100;background:rgba(12,51,25,.42);display:flex;justify-content:flex-end}
#menu .panel{width:min(420px,92vw);height:100%;background:var(--paper);overflow-y:auto;padding:16px;box-shadow:-20px 0 50px rgba(12,51,25,.3)}
#menu h2{font-family:var(--font-display);color:var(--forest);margin:4px 0 12px}
#menu h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--kicker);margin:18px 0 6px}
#menu p,#menu li{font-size:14px;line-height:1.5}
#menu .row{display:flex;gap:8px;flex-wrap:wrap}

/* the coach's spotlight — gold, so it never looks like part of Android */
.hl{position:relative;z-index:5}
.hl::after{content:"";position:absolute;inset:-6px;border-radius:inherit;min-width:100%;border:3px solid var(--gold);box-shadow:0 0 0 4px rgba(185,146,79,.28);pointer-events:none;animation:pulse 1.6s var(--ease) infinite}
.hl.round::after{border-radius:999px}
@keyframes pulse{0%{opacity:1;transform:scale(1)}70%{opacity:.25;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
.nudge{animation:nudge .5s}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-4px)}60%{transform:translateX(4px)}}

/* ---------- DEVICE ---------- */
#device{position:relative;width:100%;height:100%;overflow:hidden;background:var(--md-surface);color:var(--md-on-surface);font-family:var(--md-font);font-size:15px;display:flex;flex-direction:column;container-type:inline-size}
@media (min-width:900px){
  #device{width:412px;height:892px;flex:none;border-radius:44px;box-shadow:0 0 0 10px #1c1c1f,0 0 0 12px #3a3a40,0 40px 80px rgba(20,20,20,.45);transform-origin:center center}
  #device .sb{padding-top:14px;height:40px}
  #device::before{content:"";position:absolute;top:13px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:99px;background:#111;z-index:60}
}
.sb{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 22px;font-size:13.5px;font-weight:500;z-index:40;position:relative;color:var(--sbc,var(--md-on-surface))}
.sb .ico{display:flex;gap:6px;align-items:center}
.sb svg{width:16px;height:16px}
.sb.dark{--sbc:#fff}
#screen{flex:1;min-height:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--md-surface)}
.view.enter{animation:vin .32s var(--ease-emph)}
@keyframes vin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.view.slide{animation:vslide .28s var(--ease-emph)}
@keyframes vslide{from{opacity:.4;transform:translateX(24px)}to{opacity:1;transform:none}}
.navbar{height:24px;flex:none;display:grid;place-items:center;background:var(--nbg,transparent);z-index:40;position:relative}
.navbar button{width:108px;height:5px;border-radius:9px;background:var(--md-on-surface);opacity:.85;border:0;padding:0}
.navbar.dark button{background:#fff}
#device.withsb .view{top:-30px;padding-top:30px}

:where(#screen) svg{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
/* top app bar */
.tab{display:flex;align-items:center;gap:4px;min-height:60px;padding:4px 6px;flex:none}
.tab h1{font-size:21px;font-weight:500;margin:0;flex:1;letter-spacing:0;padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi{width:44px;height:44px;border-radius:999px;border:0;background:transparent;display:grid;place-items:center;color:var(--md-on-surface-var);flex:none}
.mi svg{width:24px;height:24px}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.mdbtn{border:0;border-radius:999px;padding:10px 22px;font-weight:600;font-size:14.5px;background:var(--md-primary);color:#fff;font-family:var(--md-font);letter-spacing:.01em}
.mdbtn.tonal{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.mdbtn.text{background:transparent;color:var(--md-primary);padding:10px 12px}
.mdbtn.out{background:transparent;color:var(--md-primary);box-shadow:inset 0 0 0 1px var(--md-outline)}
.mdbtn.danger{background:var(--md-error);color:#fff}

/* lock screen */
.lock{background:radial-gradient(130% 80% at 20% 0%,#C9B8F2 0,#8C77C9 40%,#3C2E6B 100%);color:#fff}
.lock .clk{text-align:center;margin-top:8%;font-weight:400}
.lock .clk .t{font-size:96px;line-height:.95;font-weight:300;letter-spacing:-2px;font-variation-settings:"wdth" 120}
.lock .clk .d{font-size:16px;margin-top:6px;opacity:.95}
.lock .notifs{margin:auto 12px 10px;display:grid;gap:8px}
.notif{display:grid;grid-template-columns:34px 1fr;gap:10px;background:rgba(255,255,255,.92);color:var(--md-on-surface);border-radius:22px;padding:12px 14px;text-align:left;border:0;width:100%;font-family:var(--md-font)}
.notif .ap{width:34px;height:34px;border-radius:999px;display:grid;place-items:center}
.notif .ap svg{width:20px;height:20px}
.notif .meta{font-size:12px;color:var(--md-on-surface-var);display:flex;gap:6px}
.notif b{display:block;font-size:14.5px;font-weight:600;margin-top:1px}
.notif p{margin:1px 0 0;font-size:13.5px;color:var(--md-on-surface-var);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lock .hint{text-align:center;font-size:13px;opacity:.85;margin-bottom:6px}
.headsup{position:absolute;left:8px;right:8px;top:6px;z-index:50;animation:hu .45s var(--ease-emph);box-shadow:0 8px 24px rgba(0,0,0,.25)}
@keyframes hu{from{transform:translateY(-120%)}to{transform:none}}

/* home */
.home{background:radial-gradient(90% 60% at 80% 10%,#F2D6E6 0,transparent 60%),radial-gradient(100% 70% at 0% 100%,#BFD6F3 0,transparent 60%),linear-gradient(160deg,#E9DDFF,#D9E5FF)}
.glance{padding:28px 24px 10px}
.glance .d{font-size:22px;font-weight:500}
.glance .w{font-size:14px;color:var(--md-on-surface-var);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px;padding:10px 12px;margin-top:auto}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:0;font-family:var(--md-font);font-size:12.5px;color:var(--md-on-surface)}
.app .ai{width:58px;height:58px;border-radius:999px;display:grid;place-items:center;background:var(--ib,#D7E3FF);color:var(--ic,#1B3A6B);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.app .ai svg{width:28px;height:28px}
.search svg{width:22px;height:22px;flex:none}
.search{margin:14px 16px 6px;background:var(--md-surface-high);border-radius:999px;height:52px;display:flex;align-items:center;gap:12px;padding:0 18px;color:var(--md-on-surface-var);font-size:15px}
.dock{display:grid;grid-template-columns:repeat(4,1fr);padding:4px 12px 8px}

/* lists, mail */
.li{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border:0;background:transparent;width:100%;text-align:left;font-family:var(--md-font)}
.li .av{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;font-weight:600;color:#fff;font-size:16px}
.li b{font-weight:600;font-size:15px;display:block}
.li p{margin:1px 0 0;font-size:13.5px;color:var(--md-on-surface-var);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{font-size:12px;color:var(--md-on-surface-var);align-self:start;margin-top:3px}
.li.unread b{font-weight:700}
.mailbody{padding:4px 18px 30px;font-size:15px;line-height:1.55}
.mailbody h2{font-size:22px;font-weight:400;margin:6px 0 14px;line-height:1.3}
.sender{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;margin-bottom:12px}
.sender .av{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:#fff;font-weight:600}
.sender b{display:block;font-size:14.5px}.sender span{font-size:12.5px;color:var(--md-on-surface-var)}
.chipm{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--md-outline-var);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--md-surface);color:var(--md-on-surface)}

/* chat (Sathi) */
.sathi .scroll{padding:6px 14px 10px}
.hello{margin:22% 6px 0;font-size:34px;font-weight:500;line-height:1.15;background:linear-gradient(90deg,#4F6BED,#B24FC8 60%,#E06A8C);-webkit-background-clip:text;background-clip:text;color:transparent}
.hello + p{font-size:26px;margin:4px 6px;color:#C4C0CC;font-weight:500}
.msg-u{margin:14px 0 6px auto;max-width:84%;background:var(--md-surface-high);border-radius:22px 22px 6px 22px;padding:10px 14px;font-size:15px;line-height:1.45;white-space:pre-wrap;width:fit-content}
.att-row{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.att{display:flex;align-items:center;gap:8px;border:1px solid var(--md-outline-var);border-radius:12px;padding:5px 9px 5px 5px;font-size:12.5px;background:var(--md-surface);max-width:180px}
.att img,.att .ph{width:28px;height:34px;object-fit:cover;object-position:top;border-radius:4px;background:#eee;flex:none}
.att span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-a{display:grid;grid-template-columns:28px 1fr;gap:10px;margin:14px 0}
.spark{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:conic-gradient(from 200deg,#4F6BED,#B24FC8,#E06A8C,#F2A93B,#4F6BED);color:#fff}
.spark svg{width:16px;height:16px}
.msg-a .tx{font-size:15px;line-height:1.55;min-width:0}
.msg-a .tx p{margin:0 0 9px}
.msg-a .tx h4{margin:12px 0 4px;font-size:15px}
.msg-a .tx ul{margin:0 0 8px;padding-left:20px}
.msg-a .tx li{margin:3px 0}
.ln{border-radius:6px;transition:background .2s;cursor:default}
.ln.tap{cursor:pointer;background:rgba(101,85,143,.07);box-shadow:inset 0 -2px 0 rgba(101,85,143,.35)}
.ln.sel{background:#FFF1C9;box-shadow:inset 0 -2px 0 var(--gold)}
.ln.v-ok{box-shadow:inset 0 -2px 0 #1F7A47;background:rgba(31,122,71,.09)}
.ln.v-bad{box-shadow:inset 0 -2px 0 var(--md-error);background:rgba(179,38,30,.08)}
.ln del{color:var(--md-error)} .ln ins{text-decoration:none;background:rgba(31,122,71,.14);color:#14532D;border-radius:3px;padding:0 2px}
.actions-row{display:flex;gap:2px;margin:-2px 0 0 36px;color:var(--md-on-surface-var)}
.actions-row .mi{width:36px;height:36px}.actions-row .mi svg{width:19px;height:19px}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:7px;height:7px;border-radius:9px;background:#B24FC8;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
.composer{flex:none;margin:6px 10px 8px;background:var(--md-surface-c);border-radius:28px;padding:8px 8px 8px 10px}
.composer .pend{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.composer .row{display:flex;align-items:flex-end;gap:4px}
.composer textarea{flex:1;border:0;background:transparent;resize:none;font:15px/1.4 var(--md-font);color:var(--md-on-surface);padding:9px 4px;max-height:132px;min-height:40px;outline:none}
.composer .send{width:40px;height:40px;border-radius:999px;border:0;background:var(--md-primary);color:#fff;display:grid;place-items:center;flex:none}
.composer .send:disabled{background:transparent;color:var(--md-outline)}
.composer .send svg{width:20px;height:20px}
.disclaim{font-size:11px;color:var(--md-on-surface-var);text-align:center;margin:-2px 0 4px}

/* file picker */
.picker .scroll{padding:0 10px 10px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fcard{position:relative;border:0;background:var(--md-surface-c);border-radius:14px;padding:6px 6px 8px;text-align:left;font-family:var(--md-font)}
.fcard img,.fcard .ph{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:9px;display:block;background:#fff}
.fcard span{display:block;font-size:11.5px;line-height:1.25;margin-top:5px;word-break:break-word;color:var(--md-on-surface)}
.fcard small{font-size:10.5px;color:var(--md-on-surface-var)}
.fcard .ck{position:absolute;top:10px;left:10px;width:24px;height:24px;border-radius:999px;border:2px solid #fff;background:rgba(0,0,0,.25);display:grid;place-items:center;color:#fff}
.fcard .ck svg{width:16px;height:16px;display:none}
.fcard.on{background:var(--md-primary-container)}
.fcard.on .ck{background:var(--md-primary);border-color:var(--md-primary)}
.fcard.on .ck svg{display:block}
.fcard.on img{transform:scale(.94);transition:transform .15s}
.pbar{display:flex;gap:8px;align-items:center;padding:8px 14px;flex:none}
.pbar .grow{flex:1;font-size:14px;color:var(--md-on-surface-var)}
.seglist{display:flex;gap:8px;padding:0 14px 10px;flex:none}
.seglist span{border:1px solid var(--md-outline-var);border-radius:8px;padding:6px 12px;font-size:13.5px}
.seglist span.on{background:var(--md-secondary-container);border-color:transparent}

/* doc viewer */
.docv{background:#2b2b2f}
.docv .tab{color:#fff}.docv .tab .mi{color:#fff}
.docv .scroll{padding:10px}
.docv img{width:100%;display:block;border-radius:2px;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.docv .zoombox{position:relative}
.docv .mark{position:absolute;border:3px solid var(--gold);border-radius:6px;box-shadow:0 0 0 999px rgba(0,0,0,.35);animation:pulse 1.6s infinite}

/* docs (CV editor) */
.gdoc{background:#F0F0F4}
.page{background:#fff;margin:10px 12px 20px;padding:22px 20px;box-shadow:0 1px 4px rgba(0,0,0,.15);font-family:'Spectral',Georgia,serif;color:#222;font-size:11.5px;line-height:1.45}
.page h2{font-size:19px;margin:0;text-align:center;letter-spacing:.04em}
.page .ct{text-align:center;font-family:var(--md-font);font-size:10.5px;color:#555;margin:3px 0 8px}
.page h5{font-family:var(--md-font);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#1B3A6B;border-bottom:1px solid #C9D3E6;margin:10px 0 4px;padding-bottom:2px}
.page ul{margin:2px 0;padding-left:14px}
.ph-chip{background:#FFF1C9;border:1px dashed #B9924F;border-radius:4px;padding:0 4px;font-family:var(--md-font);font-size:10px;cursor:pointer}
.ph-chip.filled{background:transparent;border:0;padding:0}

/* keyboard (Gboard-like) */
.kb{flex:none;background:#E9E7EE;padding:4px 4px 2px;user-select:none;-webkit-user-select:none;z-index:30}
.kb .strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 7px;scrollbar-width:none;align-items:center}
.kb .strip::-webkit-scrollbar{display:none}
.kb .strip .lbl{flex:none;font-size:11px;font-weight:600;color:var(--md-primary);padding:0 2px 0 4px;letter-spacing:.03em}
.kchip{flex:none;max-width:240px;border:1px solid var(--md-outline-var);background:#fff;border-radius:10px;padding:6px 10px;font:500 13px/1.25 var(--md-font);text-align:left;color:var(--md-on-surface);white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kchip.used{background:var(--md-primary-container);border-color:var(--md-primary)}
.kchip .tg{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--md-primary)}
.kchip.x .tg{color:var(--md-tertiary)}
.kb.compact .strip{flex-wrap:wrap;max-height:min(176px,30dvh);overflow-y:auto;align-items:stretch}
.kb.compact .kchip{max-width:none;flex:1 1 46%;-webkit-line-clamp:3}
.kb.compact .rows{display:none}
.kb.compact.keys .rows{display:grid}
.kb .kbt{flex:none;border:0;background:#D5D2DE;border-radius:10px;padding:6px 10px;font:600 12px var(--md-font);color:var(--md-on-surface)}
.kb .rows{display:grid;gap:7px;padding:2px 0 4px}
.kb .kr{display:flex;gap:5px;justify-content:center}
.kb .k{flex:1;max-width:38px;height:42px;border:0;border-radius:7px;background:#fff;font:400 19px var(--md-font);color:var(--md-on-surface);box-shadow:0 1px 0 rgba(0,0,0,.12);padding:0}
.kb .k.w{max-width:58px;background:#D5D2DE;font-size:14px}
.kb .k.sp{max-width:none;flex:5}
.kb .k.go{background:var(--md-primary-container);max-width:58px}
.kb .k:active{background:#ccc}

/* system dialog, sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.36);z-index:45;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--md-surface-c);border-radius:28px;padding:24px 22px 16px;width:100%;max-width:340px;animation:vin .3s var(--ease-emph)}
.dlg .di{width:26px;height:26px;margin:0 auto 14px;color:var(--md-primary);display:block}
.dlg h3{font-size:22px;font-weight:400;margin:0 0 12px;text-align:center;line-height:1.3}
.dlg p{font-size:14px;color:var(--md-on-surface-var);line-height:1.45;margin:0 0 14px}
.dlg .stack{display:grid;gap:8px}
.dlg .stack button{width:100%;padding:12px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:46;background:var(--md-surface-low);border-radius:28px 28px 0 0;padding:8px 18px 18px;animation:sheetin .35s var(--ease-emph);max-height:86%;overflow-y:auto}
@keyframes sheetin{from{transform:translateY(100%)}}
.sheet .handle{width:32px;height:4px;border-radius:9px;background:var(--md-outline);opacity:.5;margin:4px auto 14px}
.sheet h3{font-size:20px;font-weight:500;margin:0 0 4px}
.sheet .sh-sub{font-size:13.5px;color:var(--md-on-surface-var);margin:0 0 12px;line-height:1.4}
.radio{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;width:100%;text-align:left;border:0;background:transparent;padding:11px 4px;font-family:var(--md-font);border-radius:12px}
.radio i{width:20px;height:20px;border-radius:999px;border:2px solid var(--md-on-surface-var);margin-top:2px;display:grid;place-items:center}
.radio.on i{border-color:var(--md-primary)} .radio.on i::after{content:"";width:10px;height:10px;border-radius:99px;background:var(--md-primary)}
.radio b{display:block;font-weight:500;font-size:15px}
.radio span{font-size:13px;color:var(--md-on-surface-var);line-height:1.35}
.radio.pick{background:var(--md-secondary-container)}

/* Orbit (agent) — warm orange product colour */
.orbit{--ob:#B4471B;--ob-c:#FFDBCC;background:#FFF8F5}
.orbit .tab h1{font-weight:600}
.ob-hero{margin:8px 16px 14px;padding:18px;border-radius:24px;background:linear-gradient(140deg,#FFDBCC,#FFE9B8);}
.ob-hero b{font-size:20px;font-weight:600;display:block}
.ob-hero p{margin:6px 0 0;font-size:14px;color:#5B3B2C;line-height:1.4}
.conn{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border:0;background:transparent;width:100%;text-align:left;font-family:var(--md-font)}
.conn .ci{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1px #EAD9D0;font-size:20px}
.conn b{font-weight:600;font-size:15px;display:block}
.conn p{margin:1px 0 0;font-size:12.5px;color:var(--md-on-surface-var);line-height:1.3}
.st{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.st.off{background:#F1E6E1;color:#6D5A52}
.st.on{background:#D5F0DC;color:#18512E}
.st.lim{background:#FFEBC2;color:#6B4A00}
.st.no{background:#F9DEDC;color:#8C1D18}
.sw{width:52px;height:32px;border-radius:999px;background:#E7DED9;border:2px solid #8F7F78;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:99px;background:#8F7F78;transition:all .2s}
.sw.on{background:var(--ob);border-color:var(--ob)} .sw.on::after{left:24px;top:2px;width:24px;height:24px;background:#fff}
.sec-h{font-size:13px;font-weight:600;color:var(--ob,var(--md-primary));padding:14px 18px 4px;letter-spacing:.02em}
.rulecard{margin:6px 14px;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px #EAD9D0;font-size:14px;line-height:1.4;display:flex;gap:10px}
.appr{margin:10px 14px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px #EAD9D0;overflow:hidden}
.appr .ah{padding:12px 14px 6px;display:flex;gap:10px;align-items:center}
.appr .ah b{font-size:15px;font-weight:600}
.appr .ab{padding:0 14px 10px;font-size:14px;line-height:1.45;color:#3E2C24}
.appr .shot{margin:4px 14px 10px;border-radius:12px;background:#F4F0EE;padding:10px;font-size:12.5px;line-height:1.4;font-family:var(--md-font);border:1px solid #E5D9D3}
.appr .shot .url{font-size:11px;color:#6D5A52;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.appr .acts{display:flex;gap:8px;padding:8px 14px 14px;flex-wrap:wrap}
.appr .acts .mdbtn{padding:9px 16px;font-size:14px}
.appr.done{opacity:.72}
.appr .res{margin:0 14px 12px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px;display:inline-block}
.log{padding:2px 16px}
.log div{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #EFE4DE;font-size:13.5px;line-height:1.35}
.log small{color:var(--md-on-surface-var);font-family:var(--md-mono);font-size:12px}
.log .blk{color:var(--md-error);font-weight:600}
.working{display:flex;gap:10px;align-items:center;margin:8px 16px;padding:12px 14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px #EAD9D0;font-size:14px}
.orb{width:26px;height:26px;border-radius:999px;border:3px solid #FFDBCC;border-top-color:#B4471B;animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* calendar */
.cal .scroll{padding:0 0 20px}
.cday{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:8px 14px}
.cday .dn{text-align:center;color:var(--md-on-surface-var);font-size:12px}
.cday .dn b{display:block;font-size:22px;font-weight:500;color:var(--md-on-surface)}
.cev{background:#D5E3FF;color:#0E2F65;border-radius:10px;padding:8px 10px;font-size:14px;margin-bottom:6px;border:0;width:100%;text-align:left;font-family:var(--md-font)}
.cev.ag{background:#FFDBCC;color:#5B2410}
.cev small{display:block;font-size:12px;opacity:.85}
.cmonth{font-size:13px;font-weight:600;color:var(--md-primary);padding:12px 18px 2px}

/* Studio (vibe coding, dark) */
.studio{background:#131314;color:#E3E3E3;--sb2:#1E1F20}
.studio .tab{color:#E3E3E3}.studio .tab .mi{color:#C4C7C5}
.stabs{display:flex;gap:4px;padding:0 12px 8px;flex:none}
.stabs button{border:0;background:transparent;color:#C4C7C5;font:500 14px var(--md-font);padding:8px 14px;border-radius:999px}
.stabs button.on{background:#2D2F31;color:#fff}
.studio .scroll{padding:6px 14px 10px}
.studio .msg-u{background:#2D2F31;color:#E3E3E3}
.studio .composer{background:#1E1F20}
.studio .composer textarea{color:#E3E3E3}
.studio .composer .send{background:#A8C7FA;color:#062E6F}
.studio .composer .send:disabled{background:transparent;color:#666}
.studio .disclaim{color:#8E918F}
.step-l{display:grid;gap:6px;margin:8px 0 8px 36px}
.step-l div{display:flex;gap:8px;align-items:center;font-size:13.5px;color:#C4C7C5}
.step-l div i{width:16px;height:16px;border-radius:99px;border:2px solid #A8C7FA;font-style:normal;display:grid;place-items:center;font-size:10px;color:#131314;flex:none}
.step-l div.ok i{background:#A8C7FA}
.code{background:#0B0B0C;border-radius:12px;padding:10px 0;font:12px/1.55 var(--md-mono);color:#D7DAE0;overflow-x:auto;white-space:pre}
.code .cl{display:block;padding:0 12px}
.code .cl.del{background:rgba(242,139,130,.16);color:#F2B8B5}
.code .cl.bugline{background:rgba(242,184,181,.2);box-shadow:inset 4px 0 0 #F2B8B5;color:#fff}
.code .cl.add{background:rgba(129,201,149,.16);color:#B6E3C1}
.code .kw{color:#C58AF9}.code .st{color:#81C995;background:none;padding:0;border-radius:0;font-weight:400;font-size:inherit}.code .cm{color:#8E918F}
.preview{flex:1;min-height:0;margin:0 10px 10px;border-radius:16px;overflow:hidden;background:#fff;color:#1d1b20;display:flex;flex-direction:column}
.preview .pbar2{background:#2D2F31;color:#C4C7C5;font-size:12px;padding:6px 12px;display:flex;gap:8px;align-items:center}
.preview .pbar2 .dot{width:8px;height:8px;border-radius:9px;background:#81C995}
.mini{flex:1;overflow-y:auto;padding:14px;font-family:system-ui,sans-serif}
.mini h2{margin:0 0 4px;font-size:20px}
.mini .sub2{font-size:12.5px;color:#666;margin-bottom:10px}
.mini form{display:grid;gap:6px;background:#F3F4F8;padding:10px;border-radius:12px}
.mini input{border:1px solid #C9CCD6;border-radius:8px;padding:8px;font-size:14px;width:100%;background:#fff;color:#111;font-family:inherit}
.mini .row2{display:grid;grid-template-columns:1fr auto;gap:6px}
.mini .addb{background:#2457C5;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.mini ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.mini li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid #E1E3EA;border-radius:10px;padding:8px 10px;font-size:14px}
.mini li small{display:block;color:#666;font-size:12px}
.mini li .dl{position:static;display:inline;height:auto;padding:0;border:0;border-radius:0;background:none;font:700 15px var(--md-font,inherit);text-align:right;white-space:nowrap} /* intro.css also has a .dl */
.mini li .dl.bad{color:#B3261E}
.mini li .dl.soon{color:#B4471B}
.mini .foot{font-size:11px;color:#888;margin-top:12px;text-align:center}
.quickfill{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.quickfill button{border:1px dashed #9AA3B8;background:#fff;border-radius:999px;padding:4px 9px;font-size:12px;color:#33405C}

/* chats (group messaging) */
.cb{max-width:82%;background:#fff;border-radius:4px 14px 14px 14px;padding:6px 9px 4px;margin:6px 0;font-size:14.5px;line-height:1.4;box-shadow:0 1px .5px rgba(0,0,0,.13);width:fit-content}
.cb b{display:block;font-size:12.5px;font-weight:600}
.cb small{display:block;text-align:right;font-size:10.5px;color:#667781;margin-top:1px}
.cb.me{margin-left:auto;background:#D9FDD3;border-radius:14px 4px 14px 14px}
.cb a{color:#027EB5}
/* studio extras: file tree, git */
.ftree{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.ftree span{font:12px var(--md-mono);color:#C4C7C5;background:#1E1F20;border:1px solid #333;border-radius:8px;padding:4px 8px}
.ftree span.on{color:#062E6F;background:#A8C7FA;border-color:#A8C7FA}
.ghc{margin:8px 0;border:1px solid #3a3b3d;border-radius:14px;background:#1E1F20;overflow:hidden}
.ghc .gh-h{display:flex;gap:10px;align-items:center;padding:10px 12px;font-size:13.5px;color:#E3E3E3}
.ghc .gh-h b{font-weight:600}
.ghc .gh-h small{display:block;color:#8E918F;font-size:11.5px}
.ghc .gh-dot{width:14px;height:14px;border-radius:99px;border:3px solid #81C995;flex:none}
.ghc.unc .gh-dot{border-color:#F2B8B5}
.ghc .gh-files{padding:0 12px 10px 36px;font:12px var(--md-mono);color:#C4C7C5;line-height:1.7}
.ghc .gh-files i{font-style:normal;color:#81C995}.ghc .gh-files u{text-decoration:none;color:#F2B8B5}
.ghc .acts{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 12px}
.ghc .acts .mdbtn{font-size:13px;padding:8px 14px}
.ghsec{font-size:12px;font-weight:600;color:#A8C7FA;letter-spacing:.04em;margin:12px 2px 2px}
.studio .radio b{color:#E3E3E3}.studio .radio span{color:#C4C7C5}
.studio .sheet{background:#1E1F20;color:#E3E3E3}.studio .sheet .sh-sub{color:#C4C7C5}
.specdoc h6{font-family:var(--md-font);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#1B3A6B;margin:10px 0 2px}
.specdoc .gap{color:#999;font-style:italic}
.specdoc .fresh{background:#FFF1C9}
/* studio: visible thinking + stop */
.think{border-left:3px solid #5E5E66;padding:2px 0 2px 12px;margin:4px 0 6px;color:#C4C7C5;font-size:13.5px;line-height:1.5}
.think .th-h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8E918F;margin-bottom:4px}
.think p{margin:0 0 6px}
.think .off{color:#F2B8B5;text-decoration:line-through;text-decoration-color:rgba(242,184,181,.6)}
.think .off::before{content:"✗ ";text-decoration:none;display:inline-block}
.think .ok{color:#C4EED0}
.think .ok::before{content:"✓ ";display:inline-block}
.think .stopped{color:#A8C7FA;font-weight:600}
.stopbar{display:flex;align-items:center;gap:10px;margin:4px 10px 6px;padding:8px 10px;border-radius:16px;background:#1E1F20;color:#C4C7C5;font-size:13.5px}
.stopbar .orb{width:18px;height:18px;border-width:3px;border-color:#2D2F31;border-top-color:#A8C7FA}
.stopbar span:nth-child(2){flex:1}
.stopbar button{border:0;border-radius:999px;background:#F2B8B5;color:#601410;font:700 14px var(--md-font);padding:8px 16px}
/* settings */
.settings .li{grid-template-columns:28px 1fr auto}
.perm{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:center;padding:12px 18px;border:0;background:transparent;width:100%;text-align:left;font-family:var(--md-font)}
.perm b{display:block;font-weight:500;font-size:15.5px}
.perm p{margin:1px 0 0;font-size:13px;color:var(--md-on-surface-var)}

/* document viewer */
.viewer{position:absolute;left:0;right:0;bottom:24px;top:30px;z-index:58;background:#2b2b2f;display:flex;flex-direction:column;animation:vin .25s var(--ease-emph)}
@media (min-width:900px){.viewer{top:40px}}
.viewer .tab{color:#fff}.viewer .mi{color:#fff;font-size:26px;font-family:var(--md-font)}
.viewer .mi svg{width:24px;height:24px}
.viewer h1{font-size:16px}
.vscroll{flex:1;overflow:auto;padding:8px;overscroll-behavior:contain;cursor:grab;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
.vscroll.grabbing{cursor:grabbing}
.vpage img{-webkit-user-drag:none;pointer-events:none}
.vpage{position:relative;transition:width .2s}
.vpage img{width:100%;display:block;box-shadow:0 4px 18px rgba(0,0,0,.4);background:#fff}
.vmark{position:absolute;border:3px solid var(--gold);border-radius:6px;background:rgba(240,220,150,.18);box-shadow:0 0 0 3px rgba(185,146,79,.35);animation:pulse 1.8s infinite}
.vhint{flex:none;text-align:center;color:#ddd;font-size:12.5px;padding:6px;background:#1f1f22}
.att[data-view]{cursor:pointer}
.att[data-view]:hover{border-color:var(--md-primary)}
/* coach: where to look, documents strip */
.looks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}
.looks span{font-size:12px;font-weight:700;color:var(--d-dis);letter-spacing:.04em;text-transform:uppercase}
.look{border:1px solid var(--d-dis);background:var(--d-dis-t);color:var(--d-dis);border-radius:999px;padding:5px 11px;font-size:calc(13px*var(--ui));font-weight:700}
.docstrip{margin:10px 0 4px;padding:8px;border:1px dashed var(--rule-strong);border-radius:10px;background:#fff}
.docstrip b{display:block;font-size:12px;color:var(--kicker);letter-spacing:.04em;margin-bottom:6px}
.docstrip div{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.docstrip button{flex:none;width:76px;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:3px;align-items:center;font-size:10.5px;line-height:1.2;color:var(--ink)}
.docstrip img,.docstrip svg{width:100%;height:78px;object-fit:cover;object-position:top;border-radius:4px;display:block}
.docstrip span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:center}
/* ghost finger (Show me) */
#ghost{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:999px;background:rgba(185,146,79,.55);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:70;pointer-events:none;opacity:0;transition:left .55s var(--ease),top .55s var(--ease),opacity .2s,transform .15s}
#ghost.tap{transform:scale(.7)}

/* time-skip interstitial */
.skipper{position:absolute;inset:0;z-index:48;background:rgba(20,16,30,.86);color:#fff;display:grid;place-items:center;text-align:center;animation:fade .3s;font-family:var(--md-font)}
.skipper b{font-size:30px;font-weight:400;display:block}
.skipper span{opacity:.8;font-size:14px}

/* projector */

/* ============ ESL layer: listen, talk, see ============ */
.c-top{min-width:0}
.c-title span#c-head{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modepill{flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule-strong);background:var(--card);border-radius:999px;padding:4px 10px 4px 7px;font-weight:700;font-size:13px;color:var(--forest)}
.modepill span:first-child{font-size:16px;line-height:1}
.iconbtn.voice{font-size:17px}
/* what happens next: a risky choice plays out */
.c-say.cq{background:#FBEAE7;border-left:4px solid var(--d-dil,#A8322A)}
@media (min-width:900px){ .c-say.cq{margin:10px 14px 0;border-radius:10px;padding:10px 12px} }
.cqw{font:700 11.5px/1.2 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:#8C2A22;margin-bottom:3px}
.cqw .bn{letter-spacing:0;text-transform:none;font-weight:600}
.card.cq{border-color:#D9A39C}
.card.cq .btn.rew{width:100%;justify-content:center;margin-top:10px}
.btn.rew{white-space:nowrap}
@media (max-width:359px){ .c-actions .btn.rew span{display:none} }
.cq-why{margin-top:10px;font-size:13.5px;color:var(--ink-muted)}
.cq-why summary{cursor:pointer;font-weight:600;color:var(--forest)}
.cq-why p{margin:6px 0 0;line-height:1.45}
/* on the phone: what an agent did by itself */
.cqtag{display:flex;gap:8px;align-items:center;background:#FFDAD6;color:#8C1D18;border-radius:12px;padding:8px 10px;margin:8px 0 10px;font-size:13px;font-weight:600;line-height:1.3}
.log .bad{color:#8C1D18;font-weight:600}
.log .bad small{color:#B3261E}
.txn{margin:10px 16px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px #E8D3DC;padding:12px 14px;font-size:14px;line-height:1.45}
.txn .amt{font-size:24px;font-weight:600;color:#B3261E}
.txn small{display:block;color:var(--md-on-surface-var);font-size:12.5px}
.prow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--md-outline-var);font-size:14px;line-height:1.35}
.prow small{display:block;color:var(--md-on-surface-var);font-size:12.5px}
.prow .tg{flex:none;width:40px;height:22px;border-radius:99px;background:#6750A4;position:relative}
.prow .tg::after{content:'';position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:99px;background:#fff}
@media (max-width:420px){ .c-actions{gap:6px;padding-left:8px;padding-right:8px} .c-actions .btn.gold:not(.rew) span{display:none} .c-actions .btn.gold{padding:9px 12px} .c-actions .dots b{width:10px} .c-actions .dots b.on{width:16px} .c-actions .btn.next{padding:9px 12px} }
@media (max-width:520px){ .modepill .ml{display:none} .modepill{padding:4px 7px} .c-logo img{height:22px} }
/* narrow phones: the language switch becomes one button (the other language), so the lesson title has room for two lines */
@media (max-width:440px){
  .c-top{gap:6px}
  .lang button[aria-pressed="true"]{display:none}
  .lang button{padding:5px 9px}
  .c-title{font-size:14px;line-height:1.15}
  .c-title span#c-head{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}
.sayrow{display:flex;align-items:flex-start;gap:8px}
.sayrow .say{flex:1}
.ear{flex:none;border:1px solid var(--rule-strong);background:var(--card);width:calc(34px*var(--ui));height:calc(34px*var(--ui));border-radius:999px;display:grid;place-items:center;font-size:calc(15px*var(--ui));padding:0;line-height:1}
.ear:hover{background:var(--gold-soft)}
.speaking,.ear.speaking{box-shadow:0 0 0 3px var(--gold-light);background:var(--gold-soft)}
.gap{display:inline-block;width:2.4em;border-bottom:2px solid currentColor;opacity:.55;margin:0 .15em;vertical-align:-.1em}
.dshift .ds-say{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--card);border-radius:9px;padding:7px 8px 7px 11px;border:1px solid color-mix(in srgb,var(--dc) 25%,transparent)}
.ds-q{flex:1;font-family:var(--font-display);font-weight:600;font-size:calc(17px*var(--ui));color:var(--dc);line-height:1.3}
.ds-q .bn{font-family:var(--font-bn);font-weight:400}
.ds-more{margin-top:6px}
.ds-more summary{cursor:pointer;font-size:calc(13px*var(--ui));font-weight:700;color:var(--dc);list-style:none;display:inline-flex;align-items:center;gap:4px}
.ds-more summary::-webkit-details-marker{display:none}
.ds-more summary::before{content:"▸";transition:transform .2s}
.ds-more[open] summary::before{transform:rotate(90deg)}
.ds-more .ds-why{margin-top:4px}
.ds-link small{font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.wu{width:24px;height:24px;display:grid;place-items:center;font-size:15px}
.hows{display:flex;gap:8px;margin:10px 0 4px}
.hows>span{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px 4px;font-size:22px}
.hows b{font-size:13px;color:var(--forest)}
.hows .bn{font-size:12px;margin:0}
.hh{font-family:var(--font-display);color:var(--forest);font-size:calc(16px*var(--ui));margin:12px 0 6px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mode{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border:1px solid var(--rule-strong);background:var(--card);border-radius:12px;padding:9px 6px;color:var(--ink)}
.mode .mi2{font-size:26px;line-height:1.1}
.mode b{font-size:calc(14px*var(--ui));color:var(--forest)}
.mode small{font-size:calc(11.5px*var(--ui));color:var(--ink-muted);line-height:1.25}
.mode .bn{font-size:11.5px;margin:0}
.mode.on{border:2px solid var(--forest);background:var(--moss-soft);padding:8px 5px}
.tlist{margin:4px 0 8px;padding-left:18px;font-size:14px;line-height:1.45}.tlist li{margin:4px 0}
/* picture words */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(132px*var(--ui)),1fr));gap:8px}
.wtile{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--rule);background:var(--mist);border-radius:12px;padding:10px 6px;text-align:center}
.wtile .we{font-size:calc(38px*var(--ui));line-height:1.15}
.wtile b{font-family:var(--font-display);font-size:calc(18px*var(--ui));color:var(--forest)}
.wtile .wex{display:none;font-size:calc(13px*var(--ui));color:var(--ink-muted);line-height:1.3}
.wtile.open .wex{display:block}
.wtile .bn{font-size:12.5px;margin:0}
.wtile.open{background:var(--card);border-color:var(--gold)}
/* story in pictures */
.tale .tpanels{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px}
.tpanel{position:relative;margin:0;background:var(--mist);border:1px solid var(--rule);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:box-shadow .3s,background .3s;cursor:pointer}
.tpanel .pe{font-size:calc(46px*var(--ui));line-height:1.1;letter-spacing:.05em;text-align:center}
.tpanel figcaption{display:none;font-size:calc(14px*var(--ui));line-height:1.35;text-align:center}
.tale.words-on figcaption{display:block}
.tpanel .pn{position:absolute;top:5px;left:7px;font-size:11px;font-weight:800;color:var(--ink-muted)}
.tpanel.lit{background:var(--gold-soft);box-shadow:0 0 0 3px var(--gold)}
.tale .row,.phrases .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media (max-width:520px){ .tale .tpanels{grid-template-columns:1fr} .tpanel{flex-direction:row;justify-content:flex-start;padding:8px 10px 8px 26px} .tpanel .pe{font-size:34px} .tpanel figcaption{text-align:left} }
/* the four phrases */
.dphr{display:grid;gap:6px}
.dph{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;background:var(--dt);border-radius:10px;padding:7px 8px;border:1px solid color-mix(in srgb,var(--dc) 25%,transparent);cursor:pointer;transition:box-shadow .3s}
.dph small{display:block;font-size:calc(11px*var(--ui));font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dc)}
.dph .pq{font-family:var(--font-display);font-weight:600;font-size:calc(16.5px*var(--ui));color:var(--ink);line-height:1.3}
.dph .bn{margin:0}
.dph.lit{box-shadow:0 0 0 3px var(--gold)}
/* talk moments */
.talk{border:2px solid var(--forest);background:linear-gradient(var(--card),var(--card)) padding-box}
.talk-h{display:flex;align-items:center;gap:8px}
.talk-h .ti{font-size:24px;line-height:1}
.talk-h b{flex:1;font-family:var(--font-display);font-size:calc(17px*var(--ui));color:var(--forest);line-height:1.15}
.talk-h b .bn{font-family:var(--font-bn);font-weight:400;margin:0}
.tq{display:flex;align-items:center;gap:8px;margin:8px 0 4px!important;font-weight:700;font-size:calc(16px*var(--ui))!important;color:var(--ink)}
.tq>span:not(.tpic){flex:1}
.tq .bn{font-weight:400}
.tpic{font-size:calc(28px*var(--ui));line-height:1}
.roles{display:grid;gap:4px;margin:6px 0}
.roles>span{display:grid;grid-template-columns:24px 1fr;gap:6px;font-size:calc(14px*var(--ui));align-items:start}
.roles b{width:22px;height:22px;border-radius:99px;background:var(--forest);color:#fff;display:grid;place-items:center;font-size:12px}
.roles .bn{grid-column:2}
.frames{display:grid;gap:5px;margin-top:6px}
.fr{display:flex;align-items:center;gap:8px;background:var(--gold-soft);border-radius:9px;padding:6px 6px 6px 11px;font-family:var(--font-display);font-weight:600;font-size:calc(16px*var(--ui));color:#3E3110;cursor:pointer}
.fr>span{flex:1}
.fr .bn{font-family:var(--font-bn);font-weight:400;margin:0}
.fr .ear{width:30px;height:30px;font-size:13px}
.model{margin-top:8px;border:0;background:transparent;color:var(--forest);font-weight:700;font-size:calc(14px*var(--ui));padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.model-t{font-style:italic;color:var(--ink-muted);font-size:calc(14px*var(--ui))!important}
.ttimer{position:relative;overflow:hidden;flex:none;border:1px solid var(--forest);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:800;font-size:calc(14px*var(--ui));color:var(--forest);min-width:84px}
.ttimer .ttbar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--moss-soft);transition:width 1s linear}
.ttimer .tt{position:relative}
.ttimer.run{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-light)}
.ttimer.end{background:var(--ok-soft);border-color:var(--ok)}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.rec audio{width:100%;height:36px}
.rec small{color:var(--ink-muted);font-size:13px}
.talk.big .tq{font-size:calc(20px*var(--ui))!important}
.talk.big .fr{font-size:calc(19px*var(--ui))}
/* wide beats: the warm-up fills the screen on a laptop or projector; the phone waits */
@media (min-width:900px){
  body.wide #app{grid-template-columns:0 minmax(0,1fr)}
  body.wide #stagewrap{display:none}
  body.wide #cbody,body.wide .c-actions{--ui:1.18}
  body.stage.wide #cbody,body.stage.wide .c-actions{--ui:1.7}
  body.stage.wide #cbody > *{max-width:1500px}
  body.wide #coach{border-left:0}
  body.wide #cbody{padding:8px 4vw 10px}
  body.wide .c-say{padding:18px 4vw 0}
  body.wide .c-say > *{max-width:1080px;margin-left:auto;margin-right:auto}
  body.stage.wide .c-say > *{max-width:1500px}
  body.wide .c-say{--ui:1.18} body.stage.wide .c-say{--ui:1.7}
  body.wide #cbody > *{max-width:1080px;margin-left:auto;margin-right:auto}
  body.wide .say{font-size:calc(26px*var(--ui))}
  body.wide .wgrid{grid-template-columns:repeat(4,1fr);gap:12px}
  body.wide .wtile .we{font-size:calc(56px*var(--ui))}
  body.wide .wtile b{font-size:calc(22px*var(--ui))}
  body.wide .wtile .wex{font-size:calc(15px*var(--ui))}
  body.wide .tpanel .pe{font-size:calc(72px*var(--ui))}
  body.wide .tpanel figcaption{font-size:calc(17px*var(--ui))}
  body.wide .dph .pq{font-size:calc(22px*var(--ui))}
  body.wide .dphr{grid-template-columns:1fr 1fr;gap:10px}
  body.wide .talk .tq{font-size:calc(22px*var(--ui))!important}
  body.wide .talk .fr{font-size:calc(20px*var(--ui))}
  body.wide .c-actions{padding-left:4vw;padding-right:4vw}
}

table.vs{width:100%;border-collapse:collapse;font-size:calc(14.5px*var(--ui))}

table.vs td{padding:7px 6px;border-top:1px solid var(--rule)}
table.vs td:first-child{color:var(--clay-ink);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--clay) 60%,transparent)}
.mono{font-family:var(--md-mono);background:var(--mist);padding:8px;border-radius:8px;font-size:calc(13.5px*var(--ui))!important}
.four{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.four>span{display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto auto;column-gap:6px;background:var(--mist);border-radius:10px;padding:7px 8px;align-items:center}
.four i{grid-row:1/4;font-style:normal;font-size:22px}

.four em{font-style:normal;font-size:calc(12px*var(--ui));font-weight:700;color:var(--clay-ink)}
.loopline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700;color:var(--ink-muted);margin-top:10px}
.loopline span{background:var(--card);border:1px solid var(--rule-strong);border-radius:999px;padding:5px 10px;color:var(--forest)}

.idiom{display:flex;align-items:center;gap:10px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:9px 10px;margin-top:10px}
.idiom>span:first-child{font-size:30px}
.idiom p{flex:1;margin:0;font-size:calc(15px*var(--ui))}
.idiom small{display:block;color:var(--ink-muted);font-size:calc(13px*var(--ui))}
.walls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.walls>span{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 6px;font-size:28px}
.walls b{font-size:calc(15px*var(--ui));color:var(--forest)}
.walls small{font-size:calc(12.5px*var(--ui));color:var(--ink-muted)}
.fourq>div{cursor:pointer}
.fourq i{font-style:normal;display:block;font-size:22px;margin-bottom:2px}
body.stage{--ui:1.28}
@media (min-width:900px){ body.stage #coach{font-size:110%} }
