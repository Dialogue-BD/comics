<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Busy Pictures - Wimmelbook Output Flooding & AI Tap-to-Speak</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #viewer-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    #comic-img {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
      transform-origin: center center;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      margin: auto;
      transition: transform 0.05s ease-out;
    }
    
    /* Target Ring & Speech Toast */
    #target-ring {
      position: absolute;
      width: 60px;
      height: 60px;
      margin-left: -30px;
      margin-top: -30px;
      border: 3px solid #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 20px #38bdf8, inset 0 0 15px #38bdf8;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 900;
    }
    #target-ring.active {
      opacity: 1;
      transform: scale(1.1);
    }
    
    #speech-toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #f8fafc;
      padding: 12px 20px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      font-size: 14px;
      font-weight: 600;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      opacity: 0;
      max-width: 90vw;
      box-sizing: border-box;
    }
    #speech-toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    #speech-toast .toast-icon {
      font-size: 18px;
    }
    #speech-toast .toast-title {
      color: #38bdf8;
      font-weight: 700;
    }
    
    /* Prompts Panel Overlay */
    #prompt-panel {
      position: fixed;
      bottom: 24px;
      left: 24px;
      width: 380px;
      max-width: calc(100vw - 48px);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      color: #f8fafc;
      z-index: 1000;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
      box-sizing: border-box;
    }
    
    #prompt-panel.collapsed {
      transform: translateX(-420px);
      opacity: 0;
      pointer-events: none;
    }
    
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 20px;
      text-transform: uppercase;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    
    .level-a1 { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
    .level-a2 { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
    .level-b1 { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
    .level-b2 { background: linear-gradient(135deg, #ec4899, #db2777); color: #fff; }
    
    .grammar-point {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      text-align: right;
    }
    
    .close-panel {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    
    .prompt-text {
      font-size: 13.5px;
      line-height: 1.5;
      color: #f1f5f9;
      margin-bottom: 10px;
      font-weight: 500;
    }
    
    .hint-container {
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid #38bdf8;
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 12px;
    }
    
    .hint-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 2px;
    }
    
    .hint-text {
      font-size: 12px;
      color: #e2e8f0;
      font-family: monospace;
    }
    
    .filter-section {
      margin-bottom: 12px;
    }
    .filter-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .filter-btn-group {
      display: flex;
      gap: 6px;
    }
    .filter-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      font-weight: 700;
    }
    
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    
    .action-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.2s;
    }
    
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .action-btn.primary {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      font-weight: 700;
    }
    .action-btn.primary:hover {
      background: #0284c7;
      color: #fff;
    }
    
    #toggle-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #toggle-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
    
    #fullscreen-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: all 0.2s;
    }
    
    @media (max-width: 600px), (max-height: 500px) {
      #prompt-panel {
        bottom: 12px;
        left: 12px;
        width: calc(100vw - 24px);
        max-width: none;
        padding: 12px;
      }
      .prompt-text {
        font-size: 12px;
        margin-bottom: 6px;
      }
      .hint-container {
        padding: 6px 10px;
        margin-bottom: 8px;
      }
      .filter-section {
        margin-bottom: 8px;
      }
      .action-btn {
        padding: 6px;
        font-size: 11px;
      }
      #toggle-btn, #fullscreen-btn {
        bottom: 12px;
        width: 44px;
        height: 44px;
      }
    }
    .flooding-banner {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(239, 68, 68, 0.25));
      border: 1px solid rgba(245, 158, 11, 0.5);
      color: #fde047;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div id="viewer-container">
    <img id="comic-img" src="" alt="Wimmelbook Page">
    <div id="target-ring"></div>
  </div>

  <!-- Speech Toast Banner -->
  <div id="speech-toast">
    <span class="toast-icon">🔊</span>
    <div>
      <span id="toast-title" class="toast-title">Object</span>: 
      <span id="toast-text">Grammar sentence will appear here</span>
    </div>
  </div>

  <!-- Draggable/Collapsible Prompt Panel -->
  <div id="prompt-panel">
    <div class="panel-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span id="level-badge" class="badge">A1</span>
        <button class="close-panel" onclick="togglePanel(true)" title="Minimize Panel">×</button>
      </div>
      <div id="grammar-title" class="grammar-point">Present Continuous</div>
    </div>
    
    <div class="flooding-banner">⚡ আউটপুট ফ্লাডিং চ্যালেঞ্জ: ছবির প্রতিটি চরিত্রের ওপর এই নিয়মটি প্রয়োগ করুন!</div>

    <div id="prompt-text" class="prompt-text">Find a character. What are they doing right now?</div>
    
    <div class="hint-container">
      <div class="hint-title">Structure Formula (গঠনশৈলী)</div>
      <div id="hint-text" class="hint-text">is/are + verb-ing</div>
    </div>

    <div class="hint-container" style="margin-top: 8px;">
      <div class="hint-title">Example Flooding Output (ইংরেজি উদাহরণ)</div>
      <div id="example-text" class="hint-text" style="font-style: normal; white-space: pre-line; color: #cbd5e1; font-size: 11px; line-height: 1.4;"></div>
    </div>
    
    <!-- Filter Options -->
    <div class="filter-section">
      <div class="filter-label">Filter Grammar Level</div>
      <div class="filter-btn-group">
        <button id="filter-all" class="filter-btn active" onclick="setFilter('all')">All</button>
        <button id="filter-beg" class="filter-btn" onclick="setFilter('beginner')">A1-A2</button>
        <button id="filter-adv" class="filter-btn" onclick="setFilter('advanced')">B1-B2</button>
      </div>
    </div>
    
    <!-- Action buttons -->
    <div class="actions-grid">
      <button class="action-btn primary" onclick="rollAll()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        Reroll All
      </button>
      <button class="action-btn" onclick="rollImage()">New Picture</button>
      <button class="action-btn" onclick="rollPrompt()">New Prompt</button>
    </div>
  </div>

  <!-- Re-open float action button -->
  <button id="toggle-btn" onclick="togglePanel(false)" title="Restore Panel">
    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <path d="M12 16v-4"></path>
      <path d="M12 8h.01"></path>
    </svg>
  </button>

  <!-- Fullscreen Toggle Button -->
  <div id="fullscreen-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
    <svg id="enter-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
    </svg>
    <svg id="exit-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
      <path d="M4 14h6v6m10-6h-6v6M4 10h6V4m10 6h-6V4"></path>
    </svg>
  </div>

  <script>
    // Asset Lists
    var images = ["wimmelbook_1.jpg", "wimmelbook_2.jpg", "wimmelbook_3.jpg", "wimmelbook_4.jpg", "wimmelbook_5.jpg", "wimmelbook_6.jpg", "wimmelbook_7.jpg", "wimmelbook_8.jpg", "wimmelbook_9.jpg", "wimmelbook_10.jpg", "wimmelbook_11.jpg", "wimmelbook_12.jpg", "wimmelbook_13.jpg", "wimmelbook_14.jpg", "wimmelbook_15.jpg", "wimmelbook_16.jpg", "wimmelbook_17.jpg", "wimmelbook_18.jpg", "wimmelbook_19.jpg", "wimmelbook_20.jpg", "wimmelbook_21.jpg", "wimmelbook_22.jpg", "wimmelbook_23.jpg", "wimmelbook_24.jpg", "wimmelbook_25.jpg"];
    var prompts = [{"level": "A1", "grammar_point": "The Verb \"To Be\" & Descriptions", "prompt": "ছবিটিতে থাকা প্রতিটি মানুষ বা প্রাণীর দিকে একটি একটি করে আঙুল দিয়ে দেখান। ইংরেজি 'is/are' ব্যবহার করে প্রতিটি চরিত্র কেমন বা তারা কে, তা বর্ণনা করুন!", "hint": "[Subject] + is / are + [noun / adjective]", "example": "• The firefighter is brave.\n• The girl is happy.\n• The dog is fast.\n• The baker is busy."}, {"level": "A1", "grammar_point": "Subject & Object Personal Pronouns", "prompt": "একজনের সাথে আরেকজনের মিথস্ক্রিয়া করছে এমন চরিত্রগুলো খুঁজুন। প্রোনাউন (he/she/they এবং him/her/them) ব্যবহার করে প্রতি জোড়া মানুষের বর্ণনা দিন!", "hint": "He / She / They ... him / her / them", "example": "• She is talking to him.\n• He is waving at her.\n• They are watching them.\n• She is helping him."}, {"level": "A1", "grammar_point": "Present Continuous (Actions in Progress)", "prompt": "ছবির প্রতিটি মানুষ ও প্রাণীর দিকে এক এক করে আঙুল দিন। এই মুহূর্তে প্রতিটি চরিত্র ঠিক কী করছে, তা ইংরেজিতে বলুন!", "hint": "is / are + verb-ing", "example": "• The boy is riding a bike.\n• The woman is buying fruit.\n• The dog is barking at a cat.\n• The painter is climbing a ladder."}, {"level": "A1", "grammar_point": "Prepositions of Place", "prompt": "ছবির বিভিন্ন জিনিসপত্র ও প্রাণীদের খুঁজে বের করুন। Preposition (in, on, under, next to) ব্যবহার করে প্রতিটির সঠিক অবস্থান বলুন!", "hint": "in / on / under / next to / behind / in front of", "example": "• The cat is on the roof.\n• The ball is under the bench.\n• The bird is in the tree.\n• The car is next to the shop."}, {"level": "A1", "grammar_point": "Existential \"There\" (There is / There are)", "prompt": "ছবির বিভিন্ন অংশে কী কী আছে তা বলতে 'There is...' অথবা 'There are...' ব্যবহার করে ইংরেজি বাক্যের বন্যা ভাসিয়ে দিন!", "hint": "There is a... / There are many...", "example": "• There is a yellow bus near the stop.\n• There are three children playing soccer.\n• There is a cat on the wall.\n• There are many apples on the stand."}, {"level": "A1", "grammar_point": "Demonstrative Pronouns", "prompt": "স্ক্রিনের কাছের এবং দূরের জিনিসগুলোর দিকে নির্দেশ করুন। 'This/That/These/Those' ব্যবহার করে প্রতিটির বর্ণনা দিন!", "hint": "This is... / That is... / These are... / Those are...", "example": "• This is a red car right here.\n• That is a tall tower over there.\n• These are small flowers in front of me.\n• Those are big clouds in the sky."}, {"level": "A1", "grammar_point": "Possessive Adjectives & Nouns", "prompt": "ছবির প্রতিটি চরিত্রের দিকে তাকান। কার সাথে কোন জিনিসটি সম্পর্কিত বা কার মালিকানায় আছে, তা ইংরেজিতে বলুন!", "hint": "his / her / their / [Name]'s + noun", "example": "• Her hat is yellow.\n• His dog is brown.\n• Their car is parked.\n• The baker's apron is clean."}, {"level": "A1", "grammar_point": "Modals of Ability (can / can't)", "prompt": "প্রতিটি চরিত্রের দিকে এক এক করে তাকান। প্রতিটি চরিত্র কী করতে পারে বা পারে না, তা 'can / can't' দিয়ে বলুন!", "hint": "can / cannot (can't) + base verb", "example": "• The bird can fly high.\n• The little boy can't reach the shelf.\n• The dog can jump high.\n• The driver can see the light."}, {"level": "A1", "grammar_point": "Adverbs of Frequency (Routines & Habits)", "prompt": "ছবির মানুষদের পোশাক ও কাজ দেখে অনুমান করুন। 'always, usually, often, never' ব্যবহার করে তাদের দৈনন্দিন অভ্যাসের বাক্য বলুন!", "hint": "always / usually / often / never + verb", "example": "• The mailman always delivers letters at 9 AM.\n• The police officer usually patrols this street.\n• The cat never barks.\n• The children often play here."}, {"level": "A1", "grammar_point": "Imperatives & Directives", "prompt": "মনে করুন আপনি একজন ট্রাফিক বা সেফটি গার্ড! ছবির প্রতিটি চরিত্রকে একটি করে সরাসরি নির্দেশ বা সতর্কতা দিন!", "hint": "[Base verb]! / Don't + [base verb]!", "example": "• Slow down, driver!\n• Don't run near the water, boy!\n• Hold the handrail, girl!\n• Stop barking, dog!"}, {"level": "A2", "grammar_point": "Simple Past Tense (Observable Past Results)", "prompt": "ছবির আলামত (পড়ে যাওয়া আইসক্রিম, ভাঙা জিনিস) দেখে প্রতিটি চরিত্র মাত্র কী করেছে, তা অতীতকালে (Simple Past) বলুন!", "hint": "[Subject] + regular/irregular past verb", "example": "• The boy dropped his ice cream.\n• The painter finished the wall.\n• The driver stopped the car.\n• The dog chased the cat."}, {"level": "A2", "grammar_point": "Modals of Obligation & Necessity", "prompt": "ছবির প্রতিটি মানুষ ও প্রাণীর (বিড়াল, মেয়ে, চালক) দিকে তাকান। কাল্পনিকভাবে বলুন কাকে কী করতে হবে (has to/have to)!", "hint": "has to / have to / must + base verb", "example": "• The girl has to study for her test.\n• The cat has to cross the road.\n• The mailman has to deliver letters.\n• The driver has to stop at the light."}, {"level": "A2", "grammar_point": "Comparatives", "prompt": "ছবির দুটি করে জিনিস বা মানুষ তুলনা করুন। '-er than' অথবা 'more ... than' দিয়ে বাক্যের বন্যা ভাসিয়ে দিন!", "hint": "[adjective]-er than / more [adjective] than", "example": "• The bus is bigger than the car.\n• The girl is taller than her brother.\n• The dog is faster than the cat.\n• The bakery is older than the cafe."}, {"level": "A2", "grammar_point": "Superlatives", "prompt": "ছবির মানুষদের বিভিন্ন দলে ভাগ করুন এবং কে বা কোনটি 'সবচেয়ে' (tallest, fastest, oldest) তা বলুন!", "hint": "the [adjective]-est / the most [adjective]", "example": "• The clock tower is the tallest building.\n• The dog is the fastest animal.\n• The market is the busiest area.\n• The firefighter is the bravest person."}, {"level": "A2", "grammar_point": "Future Intentions (be going to)", "prompt": "গন্তব্যের দিকে এগিয়ে যাওয়া প্রতিটি চরিত্রের দিকে তাকান। প্রতিটি চরিত্র একটু পর কী করতে যাচ্ছে ('is going to...'), তা বলুন!", "hint": "is / are going to + base verb", "example": "• The girl is going to buy ice cream.\n• The driver is going to turn left.\n• The painter is going to climb the ladder.\n• The dog is going to catch the ball."}, {"level": "A2", "grammar_point": "Future Predictions (will)", "prompt": "সংঘর্ষ বা ঘটনার মুখোমুখি হতে যাওয়া পরিস্থিতিগুলোর দিকে তাকান। প্রতিটি ক্ষেত্রে ভবিষ্যতে কী ঘটবে তা 'will' দিয়ে বলুন!", "hint": "[Subject] + will + base verb", "example": "• The vase will fall.\n• The dog will bark at the cat.\n• The bus will arrive soon.\n• The boy will laugh."}, {"level": "A2", "grammar_point": "Adverbs of Manner", "prompt": "মানুষের হাঁটা বা কথা বলার স্টাইল খেয়াল করুন। প্রতিটি চরিত্র কীভাবে ('verb + -ly') কাজটি করছে তা বলুন!", "hint": "verb + [adjective]-ly", "example": "• The driver is steering carefully.\n• The officer is shouting loudly.\n• The cat is walking quietly.\n• The children are playing happily."}, {"level": "A2", "grammar_point": "Infinitive of Purpose", "prompt": "প্রতিটি মানুষ কোনো জায়গায় কেন যাচ্ছে বা কী উদ্দেশ্যে কাজ করছে, তা 'to + base verb' দিয়ে প্রকাশ করুন!", "hint": "[Verb] + to + base verb", "example": "• The man went to the bank to get money.\n• The girl stopped to pet the dog.\n• The driver pulled over to check his map.\n• She opened her umbrella to stay dry."}, {"level": "A2", "grammar_point": "Quantifiers & Density (too / enough)", "prompt": "ছবির ভিড় বা অপ্রতুল জায়গাগুলোর দিকে তাকান। 'too many / too much / not enough' দিয়ে প্রতিটি সমস্যার কথা বলুন!", "hint": "too many / too much / not enough", "example": "• There are too many people on the bus.\n• The road is not wide enough for the truck.\n• There is too much noise at the market.\n• He doesn't have enough money for cake."}, {"level": "A2", "grammar_point": "Basic Conjunctions (and, but, because, so)", "prompt": "প্রতিটি চরিত্রের কারণ ও ফলাফল যুক্ত করতে 'because / so / but' দিয়ে দুটি ঘটনা এক বাক্যে প্রকাশ করুন!", "hint": "[Clause 1] + and / but / because / so + [Clause 2]", "example": "• He ran fast because he was late, but he missed the bus.\n• She bought a hat and she put it on.\n• The dog barked, so the cat ran away.\n• It started raining, so they opened umbrellas."}, {"level": "B1", "grammar_point": "Past Continuous (Interrupted Action / Visual Tropes)", "prompt": "দুর্ঘটনা বা চমকে যাওয়া চরিত্রগুলোর দিকে তাকান। ঘটনাটি ঘটার মুহূর্তে প্রতিটি চরিত্র কী করছিল ('was -ing when...'), তা বলুন!", "hint": "was / were + verb-ing ... when + [past simple]", "example": "• The baker was carrying a cake when he tripped over the cat.\n• The woman was reading when a bird landed on her hat.\n• The boy was skating when he lost his balance.\n• The driver was talking when a ball hit his car."}, {"level": "B1", "grammar_point": "Simultaneous Actions (While / As)", "prompt": "পাশাপাশি দুটি চরিত্র আলাদা দুটি কাজ করছে এমন জোড়া খুঁজুন। 'While [A] is... [B] is...' দিয়ে বলুন!", "hint": "While [Subject A] is [verb-ing], [Subject B] is [verb-ing]", "example": "• While the baker is dropping a cake, the dog is sleeping.\n• While the driver is waiting, the girl is crossing the street.\n• While the officer is directing traffic, the thief is sneaking away.\n• While the kids are playing, the mother is watching."}, {"level": "B1", "grammar_point": "Simple Passive Voice (Present & Past)", "prompt": "ছবির বস্তু, গাড়ি বা ঘরবাড়ির দিকে তাকান। সেগুলোর ওপর কী কাজ করা হয় বা করা হয়েছিল, তা Passive দিয়ে বলুন!", "hint": "is / are / was / were + past participle", "example": "• The bread is baked every morning.\n• The window was broken by a soccer ball.\n• The car is repaired by the mechanic.\n• The letters are delivered by the mailman."}, {"level": "B1", "grammar_point": "Present Perfect Simple (Visible Evidence)", "prompt": "কাজ শেষ হওয়ার দৃশ্যমান চিহ্ন দেখে প্রতিটি চরিত্র মাত্র কী সম্পন্ন করেছে ('has [past participle]'), তা অনুমান করুন!", "hint": "has / have + past participle", "example": "• The painter has finished the wall.\n• The boy has dropped his ice cream.\n• The driver has parked the car.\n• The cat has climbed the tree."}, {"level": "B1", "grammar_point": "Second Conditional (Unreal Present)", "prompt": "সমস্যায় পড়া প্রতিটি চরিত্রের জন্য কাল্পনিক সমাধান তৈরি করুন! 'If... would...' দিয়ে বাক্য বলুন!", "hint": "If + [past simple], [would + base verb]", "example": "• If the driver had a spare tire, he would fix the truck.\n• If the boy had money, he would buy a balloon.\n• If the cat had wings, it would fly over the roof.\n• If the gardener had a hose, he would water the flowers."}, {"level": "B1", "grammar_point": "First Conditional (Real Predictions)", "prompt": "ঘটনার সম্ভাব্য শৃঙ্খলা দেখুন। এক কাজ হলে অন্য কাজের কী ফল হবে ('If [present], [will + verb]'), তা প্রতিটি চরিত্রের জন্য বলুন!", "hint": "If + [present simple], [will + base verb]", "example": "• If the ladder falls, the painter will drop his brush.\n• If the dog barks, the cat will run up the tree.\n• If it rains, everyone will open their umbrellas.\n• If he drops the tray, the glass will break."}, {"level": "B1", "grammar_point": "Defining Relative Clauses (\"I Spy\")", "prompt": "বন্ধুর সাথে 'I Spy' খেলুন! নির্দিষ্ট চরিত্রকে নিখুঁতভাবে চিহ্নিত করতে 'The person who...' দিয়ে বর্ণনা দিন!", "hint": "The person who... / The vehicle that...", "example": "• I see the man who is wearing a yellow hat and black shoes.\n• I see the dog that is chasing the ball.\n• I see the woman who is holding red flowers.\n• I see the car that is parked near the hydrant."}, {"level": "B1", "grammar_point": "Used To (Past States & Landmarks)", "prompt": "পুরোনো দালান বা বয়স্ক মানুষদের দিকে তাকান। অতীতে তারা কী ছিল বা কী করত ('used to...'), তা কল্পনা করে বলুন!", "hint": "used to + base verb", "example": "• This building used to be a train station.\n• That old man used to be a firefighter.\n• This empty lot used to be a park.\n• The driver used to ride a horse."}, {"level": "B1", "grammar_point": "Gerunds vs Infinitives (Verb Patterns)", "prompt": "প্রতিটি চরিত্র কী করতে পছন্দ করে বা কী করার সিদ্ধান্ত নিয়েছে, তা 'enjoys -ing / decided to...' দিয়ে প্রকাশ করুন!", "hint": "enjoy + [verb-ing] / decide + [to + base verb]", "example": "• The boy enjoys riding his skateboard.\n• The woman decided to buy a fresh loaf of bread.\n• The cat loves sleeping in the sun.\n• The painter promised to finish the wall."}, {"level": "B1", "grammar_point": "Modals of Deduction (Present)", "prompt": "চরিত্রগুলোর এক্সপ্রেশন দেখে বর্তমানে তারা কী অবস্থায় আছে বা কেন এমন করছে ('must be / might be'), তা অনুমান করুন!", "hint": "must be / might be / can't be + verb-ing", "example": "• He must be lost because he is holding a map upside down.\n• She might be waiting for her friend.\n• They can't be happy because they are arguing.\n• The cat must be hungry because it is staring at fish."}, {"level": "B2", "grammar_point": "Third Conditional (Alternate Past / Regrets)", "prompt": "দুর্ঘটনা বা ভুলের দিকে তাকান। অতীতে পরিস্থিতি অন্যরকম হলে কী হতো ('If [had done], [would have done]'), তা প্রতিটি চরিত্রের জন্য বলুন!", "hint": "If + [past perfect], [would have + past participle]", "example": "• If the cyclist had worn a helmet, he wouldn't have hurt his head.\n• If the driver had seen the sign, he wouldn't have turned left.\n• If the baker hadn't slipped, he wouldn't have dropped the cake.\n• If the cat hadn't barked, the birds wouldn't have flown away."}, {"level": "B2", "grammar_point": "Wishes & Regrets (wish / if only)", "prompt": "বিপদে পড়া প্রতিটি চরিত্রের জায়গায় নিজেকে বসিয়ে কাল্পনিক আফসোস বা আক্ষেপ প্রকাশ করুন!", "hint": "wishes + [subject] + had / past tense", "example": "• The driver wishes he hadn't parked under the bird tree.\n• The boy wishes he had held onto his ice cream cone.\n• The painter wishes he had used a longer ladder.\n• The runner wishes she had brought a water bottle."}, {"level": "B2", "grammar_point": "Present Perfect Continuous (Deduce Duration)", "prompt": "ক্লান্ত বা নোংরা মানুষদের দেখে তারা কতক্ষণ ধরে কাজ করছে ('has been -ing for hours'), তা অনুমান করে বলুন!", "hint": "has / have been + verb-ing", "example": "• The gardener has been digging holes all morning.\n• The painter has been working on the building for hours.\n• The runner has been jogging since sunrise.\n• The children have been playing in the mud since noon."}, {"level": "B2", "grammar_point": "Modals of Deduction (Past)", "prompt": "ছবির বি     // State
    var activeFilter = "all";
    var currentImageIndex = 0;
    var currentPromptIndex = 0;
    
    var img = document.getElementById("comic-img");
    var panel = document.getElementById("prompt-panel");
    var restoreBtn = document.getElementById("toggle-btn");
    var targetRing = document.getElementById("target-ring");
    var speechToast = document.getElementById("speech-toast");
    var toastTitle = document.getElementById("toast-title");
    var toastText = document.getElementById("toast-text");
    
    var toastTimeout = null;
    
    // Unlock Audio Context on first mobile touch
    document.body.addEventListener("touchstart", function unlockAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.resume();
      }
      document.body.removeEventListener("touchstart", unlockAudio);
    }, { once: true });

    // Initialization
    function init() {
      rollAll();
      centerContent();
    }
    
    // Panel minimization
    function togglePanel(collapse) {
      if (collapse) {
        panel.classList.add("collapsed");
        restoreBtn.classList.add("visible");
      } else {
        panel.classList.remove("collapsed");
        restoreBtn.classList.remove("visible");
      }
    }
    
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {});
        document.getElementById("enter-icon").style.display = "none";
        document.getElementById("exit-icon").style.display = "block";
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(err => {});
        }
        document.getElementById("enter-icon").style.display = "block";
        document.getElementById("exit-icon").style.display = "none";
      }
    }
    
    // Filtering logic
    function setFilter(filterType) {
      activeFilter = filterType;
      document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
      if (filterType === "all") document.getElementById("filter-all").classList.add("active");
      else if (filterType === "beginner") document.getElementById("filter-beg").classList.add("active");
      else if (filterType === "advanced") document.getElementById("filter-adv").classList.add("active");
      
      if (!isPromptMatchingFilter(prompts[currentPromptIndex], filterType)) {
        rollPrompt();
      }
    }
    
    function isPromptMatchingFilter(prompt, filter) {
      if (filter === "all") return true;
      var level = prompt.level;
      if (filter === "beginner") return (level === "A1" || level === "A2");
      if (filter === "advanced") return (level === "B1" || level === "B2");
      return false;
    }
    
    function getFilteredPrompts() {
      return prompts.filter(p => isPromptMatchingFilter(p, activeFilter));
    }
    
    // Rolling
    function rollImage() {
      var newIndex;
      do {
        newIndex = Math.floor(Math.random() * images.length);
      } while (images.length > 1 && newIndex === currentImageIndex);
      
      currentImageIndex = newIndex;
      img.src = images[currentImageIndex] + "?v=" + Date.now();
      
      scale = 1;
      posX = 0;
      posY = 0;
      updateTransform();
    }
    
    function rollPrompt() {
      var filtered = getFilteredPrompts();
      if (filtered.length === 0) return;
      
      var rolledPrompt;
      do {
        rolledPrompt = filtered[Math.floor(Math.random() * filtered.length)];
      } while (filtered.length > 1 && rolledPrompt === prompts[currentPromptIndex]);
      
      currentPromptIndex = prompts.indexOf(rolledPrompt);
      updatePromptUI();
    }
    
    function rollAll() {
      rollImage();
      rollPrompt();
    }
    
    function updatePromptUI() {
      var prompt = prompts[currentPromptIndex];
      
      var badge = document.getElementById("level-badge");
      badge.className = "badge level-" + prompt.level.toLowerCase();
      badge.innerText = prompt.level;
      
      document.getElementById("grammar-title").innerText = prompt.grammar_point;
      document.getElementById("prompt-text").innerText = prompt.prompt;
      document.getElementById("hint-text").innerText = prompt.hint;
      document.getElementById("example-text").innerText = prompt.example;
    }
    
    // TAP TO RECOGNIZE & SPEAK ENGINE
    function handleImageTap(clientX, clientY) {
      var rect = img.getBoundingClientRect();
      if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) return;

      var relX = ((clientX - rect.left) / rect.width) * 100;
      var relY = ((clientY - rect.top) / rect.height) * 100;

      var pageKey = "wimmelbook_" + (currentImageIndex + 1);
      var objects = spatialIndex[pageKey] || [];

      var matched = null;
      for (var i = 0; i < objects.length; i++) {
        var box = objects[i].box;
        if (relX >= box[0] && relX <= box[2] && relY >= box[1] && relY <= box[3]) {
          matched = objects[i];
          break;
        }
      }

      if (!matched && objects.length > 0) {
        var minDist = 99999;
        for (var j = 0; j < objects.length; j++) {
          var b = objects[j].box;
          var cx = (b[0] + b[2]) / 2;
          var cy = (b[1] + b[3]) / 2;
          var dist = Math.hypot(relX - cx, relY - cy);
          if (dist < minDist) {
            minDist = dist;
            matched = objects[j];
          }
        }
      }

      if (matched) {
        triggerObjectTap(matched, clientX, clientY);
      }
    }

    function triggerObjectTap(obj, clientX, clientY) {
      // Target ring
      targetRing.style.left = clientX + "px";
      targetRing.style.top = clientY + "px";
      targetRing.classList.add("active");
      setTimeout(() => targetRing.classList.remove("active"), 800);

      // Build Sentence
      var prompt = prompts[currentPromptIndex];
      var gData = obj.grammar_data;
      var sentence = buildGrammarSentence(gData, prompt);

      var fullSpeechText = obj.name + ". " + sentence;
      showSpeechToast(obj.name, sentence);
      speakText(fullSpeechText);
    }

    function buildGrammarSentence(gData, prompt) {
      var gp = prompt.grammar_point.toLowerCase();
      if (gp.includes("present continuous")) return gData.subject + " " + gData.present_continuous + ".";
      if (gp.includes("past tense") || gp.includes("simple past")) return gData.subject + " " + gData.simple_past + ".";
      if (gp.includes("going to")) return gData.subject + " " + gData.future_going_to + ".";
      if (gp.includes("will")) return gData.subject + " " + gData.future_will + ".";
      if (gp.includes("obligation") || gp.includes("have to")) return gData.subject + " " + gData.modals_obligation + ".";
      if (gp.includes("ability") || gp.includes("can")) return gData.subject + " " + gData.modals_ability + ".";
      if (gp.includes("purpose")) return gData.subject + " " + gData.infinitive_purpose + ".";
      if (gp.includes("quantifier") || gp.includes("too")) return gData.subject + " " + gData.quantifier_problem + ".";
      if (gp.includes("past continuous")) return gData.subject + " " + gData.past_continuous + ".";
      if (gp.includes("passive")) return gData.subject + " " + gData.simple_passive + ".";
      if (gp.includes("present perfect")) return gData.subject + " " + gData.present_perfect + ".";
      if (gp.includes("second conditional")) return gData.second_conditional;
      if (gp.includes("third conditional")) return gData.third_conditional;
      if (gp.includes("used to")) return gData.subject + " " + gData.used_to + ".";
      if (gp.includes("perception")) return gData.perception + ".";
      if (gp.includes("wish")) return gData.subject + " " + gData.wishes + ".";
      
      return gData.subject + " " + gData.present_continuous + ".";
    }

    function showSpeechToast(name, sentence) {
      toastTitle.innerText = name;
      toastText.innerText = sentence;
      speechToast.classList.add("visible");

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        speechToast.classList.remove("visible");
      }, 3500);
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.85;
      u.pitch = 1.0;
      u.lang = 'en-US';
      window.speechSynthesis.speak(u);
    }

    // PINCH-TO-ZOOM & PAN LOGIC
    var scale = 1;
    var posX = 0, posY = 0;
    var baseScale = 1, basePosX = 0, basePosY = 0;
    var startX = 0, startY = 0;
    var activeTouch = false, isPinching = false, isGesture = false;
    var touchStartTime = 0, startTouchX = 0, startTouchY = 0;

    function centerContent() {
      posX = 0;
      posY = 0;
      updateTransform();
    }
    
    function updateTransform() {
      img.style.transform = "translate(" + posX + "px, " + posY + "px) scale(" + scale + ")";
    }
    
    // CLICK / TOUCH TAP DETECTION
    document.getElementById("viewer-container").addEventListener("click", function(e) {
      if (e.target.closest("#prompt-panel") || e.target.closest("#toggle-btn") || e.target.closest("#fullscreen-btn")) return;
      handleImageTap(e.clientX, e.clientY);
    });

    // TOUCH EVENTS
    document.body.addEventListener("touchstart", function(e) {
      if (e.target.closest("#prompt-panel") || e.target.closest("#toggle-btn") || e.target.closest("#fullscreen-btn")) return;
      activeTouch = true;
      if (e.touches.length === 2) {
        isPinching = true;
        initDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        baseScale = scale;
        basePosX = posX;
        basePosY = posY;
      } else if (e.touches.length === 1) {
        isPinching = false;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        basePosX = posX;
        basePosY = posY;
        touchStartTime = Date.now();
        startTouchX = e.touches[0].clientX;
        startTouchY = e.touches[0].clientY;
        isGesture = false;
      }
    });

    document.body.addEventListener("touchmove", function(e) {
      if (e.target.closest("#prompt-panel") || e.target.closest("#toggle-btn") || e.target.closest("#fullscreen-btn")) return;
      if (isPinching && e.touches.length === 2) {
        e.preventDefault();
        var dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        var factor = dist / initDist;
        var newScale = baseScale * factor;
        if (newScale < 1) newScale = 1;
        if (newScale > 5) newScale = 5;
        scale = newScale;
        updateTransform();
      } else if (e.touches.length === 1) {
        var dx = e.touches[0].clientX - startTouchX;
        var dy = e.touches[0].clientY - startTouchY;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
          isGesture = true;
        }
        if (scale > 1) {
          e.preventDefault();
          posX = basePosX + (e.touches[0].clientX - startX);
          posY = basePosY + (e.touches[0].clientY - startY);
          updateTransform();
        }
      }
    });

    document.body.addEventListener("touchend", function(e) {
      if (e.target.closest("#prompt-panel") || e.target.closest("#toggle-btn") || e.target.closest("#fullscreen-btn")) return;
      if (e.touches.length === 0) {
        if (!isGesture && (Date.now() - touchStartTime < 300)) {
          handleImageTap(startTouchX, startTouchY);
        }
        activeTouch = false;
        isPinching = false;
      }
    });

    window.onload = function() {
      init();
    };
  </script>
