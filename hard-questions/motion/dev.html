<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../dialogue-brand.css"><link rel="stylesheet" href="stage.css">
<style>body{margin:0;background:#111}#s{width:1280px}</style></head><body><div id="s"></div>
<script src="vendor/gsap.min.js"></script><script src="vendor/DrawSVGPlugin.min.js"></script><script src="vendor/MotionPathPlugin.min.js"></script>
<script type="module">
import {createStage} from './stage.js';
const q=new URLSearchParams(location.search),id=q.get('voice')||'kamille';
const [voices,tr]=await Promise.all([fetch('../voices.json').then(r=>r.json()),fetch('../transcripts.json').then(r=>r.json())]);
const st=createStage(document.getElementById('s'));window.stage=st;
try{await st.load(voices.find(v=>v.id===id),tr[id]);window.ready=true;}catch(e){window.loadError=String(e.stack||e);}
</script></body></html>
