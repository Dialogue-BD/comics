<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d0b">
  <title>Mezban · Tell it live</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="classroom/viewer.css?v=20261007-mezban-1">
</head>
<body>
  <header class="toolbar">
    <a class="brand" href="/" aria-label="Dialogue home"><img src="../brand/dialogue-logo.png" alt="Dialogue"></a>
    <div class="title"><strong>Mezban</strong><span>Tell it live · You’re the storyteller</span></div>
    <a class="student-link" href="./">Student listening →</a>
  </header>
  <main id="viewer" tabindex="0" aria-label="Wordless comic. Scroll or drag to move through the story.">
    <div id="pages"></div>
  </main>
  <nav class="controls" aria-label="Comic controls">
    <button id="previous" type="button" aria-label="Previous page">←</button>
    <select id="page" aria-label="Choose comic page"></select>
    <button id="next" type="button" aria-label="Next page">→</button>
    <div class="zoom-controls">
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <output id="zoom" aria-label="Zoom level">100%</output>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="fit-width" type="button">Fit width</button>
      <button id="fit-page" type="button">Whole page</button>
    </div>
    <button id="fullscreen" type="button" aria-label="Enter fullscreen">Fullscreen</button>
  </nav>
  <p id="status" role="status" hidden></p>
  <script src="story.js?v=20261007-mezban-1"></script>
  <script>const CLASSROOM_STORY = {
    frames: MEZBAN_STORY.portraitPages.map(page => ({ ...page, width: 1080, height: 1080 * 1672 / 941 })),
    chapters: ['Homecoming', 'Excuses', 'Empty chairs', 'Outside the gate', 'The invitation', 'Welcome', 'Serving', 'One table'].map(title => ({title}))
  };</script>
  <script src="classroom/viewer.js?v=20261007-mezban-1"></script>
</body>
</html>
